<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hanky is Home</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a0a04;--bg2:#2e1a0a;--cream:#FBF4E4;--amber:#C8720A;--gold:#E8921A;
  --brown:#3A1F0E;--tan:#7A4520;--light-tan:#B07040;--soft:#FEFAF2;
  --text-dim:rgba(251,244,228,.58);--text-mid:rgba(251,244,228,.78);--text-hi:rgba(251,244,228,.92);
}
html{height:100%;overflow:hidden;background:var(--bg);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{
  height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:'Crimson Pro',Georgia,serif;color:var(--cream);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button,a,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ── MAIN WRAPPER ── */
#app{
  width:100%;max-width:520px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex}

/* ── PROGRESS BAR ── */
.progress-bar{height:3px;background:var(--bg);flex-shrink:0;position:relative;z-index:5}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--gold));transition:width .8s ease;width:0%}

/* ── HUD ── */
.hud{
  background:rgba(20,7,2,.9);padding:8px 16px;display:flex;justify-content:space-between;
  align-items:center;flex-shrink:0;z-index:5;backdrop-filter:blur(4px);
}
.hud-chapter{
  font-family:'Fraunces',serif;font-size:11px;font-weight:700;
  letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);
}
.hud-goal{font-size:12px;color:var(--text-dim);font-style:italic}

/* ── STORY AREA — flex-fit to viewport ── */
.story-area{
  flex:1;display:flex;flex-direction:column;min-height:0;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.story-area::-webkit-scrollbar{width:3px}
.story-area::-webkit-scrollbar-track{background:transparent}
.story-area::-webkit-scrollbar-thumb{background:rgba(200,114,10,.3);border-radius:3px}

/* ── TITLE SCREEN ── */
.title-screen{
  background:linear-gradient(160deg,#1a1008 0%,#3d2210 60%,#1a0a04 100%);
  align-items:center;justify-content:center;text-align:center;
  padding:clamp(16px,4vh,40px) 28px;gap:0;position:relative;overflow:hidden;
  overflow-y:auto;
}
.title-stars{position:absolute;inset:0;pointer-events:none}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle 3s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
.title-hero{
  font-size:clamp(60px,16vh,120px);line-height:1;
  animation:float 4s ease-in-out infinite;
  filter:drop-shadow(0 8px 24px rgba(200,114,10,.35));
  position:relative;z-index:2;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.title-paws{font-size:16px;letter-spacing:12px;margin-top:clamp(12px,3vh,32px);opacity:.7}
.title-name{
  font-family:'Fraunces',serif;font-size:clamp(32px,8vw,52px);font-weight:800;
  color:var(--brown);font-style:italic;line-height:1.05;
}
.title-card{
  background:var(--soft);border-radius:28px 28px 0 0;padding:clamp(16px,3vh,28px) 28px clamp(24px,5vh,48px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.5vh,14px);text-align:center;
  width:calc(100% + 56px);margin:clamp(12px,3vh,32px) -28px -40px;position:relative;z-index:2;
}
.title-sub{font-size:16px;color:var(--tan);line-height:1.6}
.title-hint{font-size:12px;color:var(--light-tan);font-style:italic;opacity:.7}
.btn-start{
  background:var(--amber);color:var(--soft);border:none;border-radius:50px;
  padding:16px 44px;font-family:'Fraunces',serif;font-size:19px;font-weight:700;
  cursor:pointer;width:100%;max-width:260px;
  box-shadow:0 4px 20px rgba(200,114,10,.45);
  transition:transform .15s,box-shadow .15s;
}
.btn-start:active{transform:scale(.96);box-shadow:0 2px 10px rgba(200,114,10,.3)}

/* ── CHAPTER INTRO OVERLAY ── */
.chapter-intro{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(10,4,1,.94);text-align:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.chapter-intro.active{opacity:1;pointer-events:all}
.ch-intro-num{
  font-family:'Fraunces',serif;font-size:11px;letter-spacing:3.5px;
  text-transform:uppercase;color:var(--gold);margin-bottom:10px;
}
.ch-intro-name{
  font-family:'Fraunces',serif;font-size:clamp(24px,6vh,38px);font-weight:800;
  color:var(--cream);font-style:italic;line-height:1.1;margin-bottom:clamp(8px,1.5vh,14px);
}
.ch-intro-sub{font-size:clamp(13px,1.8vh,15px);color:var(--text-mid);line-height:1.7}

/* ── STORY CONTENT BLOCKS ── */
.scene-block{
  padding:clamp(8px,2vh,20px) 18px;animation:fadeUp .5s ease both;
  border-bottom:1px solid rgba(200,114,10,.08);flex-shrink:1;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.scene-emoji{
  font-size:clamp(28px,6vh,52px);text-align:center;display:block;margin:clamp(2px,1vh,8px) 0 clamp(4px,1vh,12px);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));
}
.scene-label{
  font-family:'Fraunces',serif;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--gold);text-align:center;
  margin-bottom:4px;
}
.scene-text{
  font-size:clamp(13px,1.8vh,16px);line-height:1.65;color:var(--text-mid);text-align:center;
}
.scene-text em{color:var(--gold);font-style:italic}

/* ── LOCATION ITEMS ── */
.location-list{
  padding:clamp(6px,1.2vh,16px) 14px;display:flex;flex-direction:column;
  gap:clamp(5px,1vh,10px);flex:1;justify-content:center;
}

.location-item{
  background:rgba(255,255,255,.04);border:1.5px solid rgba(200,114,10,.18);
  border-radius:12px;padding:clamp(8px,1.3vh,14px) 14px;display:flex;align-items:center;
  gap:clamp(8px,1.5vw,14px);
  cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden;
}
.location-item:active{transform:scale(.97)}
.location-item:hover{border-color:rgba(200,114,10,.4);background:rgba(255,255,255,.06)}
.location-item.visited{
  opacity:.4;border-color:rgba(255,255,255,.06);pointer-events:none;
  background:rgba(255,255,255,.02);
}
.location-item .loc-emoji{font-size:clamp(22px,3.5vh,32px);flex-shrink:0}
.location-item .loc-info{flex:1;min-width:0}
.location-item .loc-name{
  font-family:'Fraunces',serif;font-size:clamp(13px,1.8vh,15px);font-weight:700;color:var(--cream);
}
.location-item .loc-hint{font-size:clamp(10px,1.4vh,12px);color:var(--text-dim);margin-top:1px}
.location-item .loc-badge{
  font-size:9px;background:var(--amber);color:#fff;padding:3px 8px;border-radius:20px;
  font-family:'Fraunces',serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  flex-shrink:0;
}
.location-item.visited .loc-badge{display:none}
.location-item.key-item{border-color:rgba(232,146,26,.35)}
.location-item.key-item .loc-badge{background:var(--gold);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.location-item.key-locked{
  display:none;
}
.location-item.key-revealed{
  display:flex;
  animation:keyReveal .6s ease both;
}
@keyframes keyReveal{
  from{opacity:0;transform:translateY(12px) scale(.95);border-color:var(--gold)}
  60%{border-color:var(--gold);box-shadow:0 0 20px rgba(232,146,26,.3)}
  to{opacity:1;transform:translateY(0) scale(1);border-color:rgba(232,146,26,.35);box-shadow:none}
}

/* ── DISCOVERY PANEL ── */
.discovery-panel{
  background:var(--soft);border-top:3px solid var(--amber);
  padding:clamp(10px,1.5vh,18px) 16px clamp(10px,1.5vh,20px);margin:0 12px clamp(6px,1vh,12px);
  border-radius:0 0 16px 16px;animation:slideReveal .3s ease both;
}
@keyframes slideReveal{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.disc-who{
  font-family:'Fraunces',serif;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--amber);margin-bottom:6px;
}
.disc-text{font-size:15px;line-height:1.75;color:var(--tan)}
.disc-text em{color:var(--brown);font-style:italic}

/* ── ACTION BUTTONS ── */
.action-row{display:flex;gap:10px;margin-top:14px;justify-content:center}
.btn-action{
  background:var(--amber);color:#fff;border:none;border-radius:40px;
  padding:11px 28px;font-family:'Fraunces',serif;font-size:15px;cursor:pointer;
  transition:transform .12s;
}
.btn-action:active{transform:scale(.95)}
.btn-action.secondary{
  background:transparent;border:1.5px solid rgba(200,114,10,.4);color:var(--gold);
}

/* ── MINIGAME AREA ── */
.minigame-panel{
  padding:clamp(12px,2vh,24px) 20px;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:clamp(8px,1.5vh,12px);animation:fadeUp .4s ease both;
  flex:1;justify-content:center;
}
.mg-title{
  font-family:'Fraunces',serif;font-size:clamp(20px,5vw,28px);font-weight:800;
  color:var(--cream);font-style:italic;line-height:1.1;
}
.mg-desc{font-size:clamp(12px,1.6vh,14px);color:var(--text-dim);line-height:1.5}
.mg-emoji{
  font-size:clamp(40px,8vh,56px);display:block;transition:transform .15s ease;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));
}
.mg-track{
  width:100%;max-width:260px;height:10px;background:rgba(255,255,255,.08);
  border-radius:5px;overflow:hidden;
}
.mg-fill{
  height:100%;width:0%;background:linear-gradient(90deg,var(--amber),var(--gold));
  border-radius:5px;transition:width .1s ease;
}
.mg-counter{font-family:'Fraunces',serif;font-size:12px;color:var(--gold);letter-spacing:1px}
.mg-tap-btn{
  background:var(--amber);color:#fff;border:none;border-radius:50px;
  padding:16px 40px;font-family:'Fraunces',serif;font-size:18px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 16px rgba(200,114,10,.45);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:transform .08s;
}
.mg-tap-btn:active:not(:disabled){transform:scale(.93)}
.mg-tap-btn:disabled{opacity:.5}
.mg-note{
  font-style:italic;color:var(--gold);font-size:14px;min-height:20px;line-height:1.6;
}

/* ── CHOICE BUTTONS ── */
.choice-row{display:flex;gap:10px;width:100%;max-width:300px}
.choice-btn{
  flex:1;border:2px solid;border-radius:12px;padding:14px 10px;
  font-family:'Fraunces',serif;font-size:15px;cursor:pointer;
  text-align:center;background:transparent;touch-action:manipulation;
  transition:transform .12s;
}
.choice-btn:active{transform:scale(.95)}
.choice-btn.yes{border-color:var(--amber);color:var(--gold)}
.choice-btn.no{border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.45)}
.choice-btn:disabled{opacity:.3;pointer-events:none}

/* ── APPROACH MINIGAME ── */
.approach-scene{
  width:100%;max-width:280px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.approach-humans{font-size:44px;transition:all .4s ease}
.approach-hank{font-size:40px;display:block;transition:all .4s ease}

/* ── BEAT / TRANSITION PANEL ── */
.beat-panel{
  padding:clamp(16px,3vh,28px) 24px;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:clamp(10px,2vh,16px);animation:fadeUp .5s ease both;
  flex:1;justify-content:center;
}
.beat-emoji{
  font-size:clamp(40px,8vh,60px);display:block;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.3));
}
.beat-text{font-size:clamp(14px,1.8vh,16px);line-height:1.75;color:var(--text-mid);max-width:340px}
.beat-text em{color:var(--gold);font-style:italic}

/* ── END SCREEN ── */
.end-screen{
  background:linear-gradient(160deg,#1a1008,#3d2210);
  align-items:center;justify-content:center;text-align:center;
  padding:clamp(16px,4vh,40px) 28px;gap:0;position:relative;overflow:hidden;
  overflow-y:auto;
}
.end-hero{
  font-size:clamp(56px,14vh,100px);line-height:1;
  animation:heartbeat 2.5s ease-in-out infinite;
  filter:drop-shadow(0 6px 20px rgba(200,114,10,.4));
  position:relative;z-index:2;
}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(1)}42%{transform:scale(1.15)}70%{transform:scale(1)}}
.end-card{
  background:var(--soft);border-radius:28px 28px 0 0;padding:clamp(16px,3vh,28px) 28px clamp(24px,5vh,48px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.2vh,12px);text-align:center;
  width:calc(100% + 56px);margin:clamp(12px,3vh,28px) -28px -40px;position:relative;z-index:2;
}
.end-h{
  font-family:'Fraunces',serif;font-size:clamp(24px,5vh,36px);font-weight:800;
  color:var(--brown);font-style:italic;
}
.end-p{font-size:clamp(13px,1.8vh,15px);color:var(--tan);line-height:1.7;max-width:320px}
.end-p em{color:var(--brown);font-style:italic;font-weight:600}
.end-label{
  font-family:'Fraunces',serif;font-size:11px;letter-spacing:2.5px;
  color:var(--light-tan);text-transform:uppercase;
}
.btn-restart{
  background:transparent;border:2px solid var(--amber);color:var(--amber);
  border-radius:40px;padding:12px 32px;font-family:'Fraunces',serif;font-size:16px;
  cursor:pointer;transition:all .15s;
}
.btn-restart:active{transform:scale(.95)}

/* ── RESPONSIVE ── */
/* Short screens (iPhone SE, small Androids) */
@media(max-height:680px){
  .scene-block{padding:6px 14px}
  .scene-emoji{font-size:24px;margin:2px 0 4px}
  .scene-text{font-size:12px;line-height:1.5}
  .scene-label{font-size:10px;margin-bottom:2px}
  .location-list{padding:4px 12px;gap:4px}
  .location-item{padding:7px 10px;gap:8px;border-radius:10px}
  .location-item .loc-emoji{font-size:20px}
  .location-item .loc-name{font-size:12px}
  .location-item .loc-hint{font-size:10px;margin-top:0}
  .location-item .loc-badge{font-size:8px;padding:2px 6px}
  .mg-tap-btn{padding:12px 28px;font-size:15px}
  .mg-emoji{font-size:36px}
  .beat-emoji{font-size:36px}
  .discovery-panel{padding:8px 12px;margin:0 8px 4px}
  .disc-text{font-size:13px;line-height:1.5}
  .btn-action{padding:8px 20px;font-size:13px}
  .hud{padding:5px 12px}
  .separator-block{padding:4px 14px !important}
  .title-hero{font-size:60px}
  .title-card{padding:14px 20px 24px;gap:8px;margin-top:10px}
  .title-sub{font-size:14px}
  .btn-start{padding:12px 32px;font-size:16px}
  .end-hero{font-size:56px}
  .end-card{padding:14px 20px 24px;gap:8px;margin-top:10px}
  .end-p{font-size:13px;line-height:1.6}
  .choice-btn{padding:10px 8px;font-size:13px}
  .mg-track{height:8px}
}
/* Medium-short screens */
@media(max-height:780px) and (min-height:681px){
  .scene-emoji{font-size:32px;margin:4px 0 6px}
  .scene-text{font-size:13px;line-height:1.55}
  .location-list{padding:6px 14px;gap:6px}
  .location-item{padding:9px 12px;gap:10px}
  .location-item .loc-emoji{font-size:24px}
  .location-item .loc-name{font-size:13px}
  .location-item .loc-hint{font-size:11px}
}
@media(max-width:360px){
  .scene-text,.disc-text{font-size:13px}
  .location-item{padding:8px 10px;gap:8px}
  .location-item .loc-emoji{font-size:22px}
  .mg-tap-btn{padding:12px 28px;font-size:15px}
}
@media(min-width:521px){
  #app{height:100vh;height:100dvh;border-left:1px solid rgba(200,114,10,.1);border-right:1px solid rgba(200,114,10,.1)}
}
</style>
</head>
<body>
<div id="app">

<!-- ═══ TITLE SCREEN ═══ -->
<div class="screen title-screen active" id="screen-title">
  <div class="title-stars" id="title-stars"></div>
  <div class="title-hero">🐶</div>
  <div class="title-card">
    <div class="title-paws">🐾 🐾 🐾</div>
    <h1 class="title-name">Hanky is Home</h1>
    <p class="title-sub">A little puppy named Hank.<br>And one very long day.</p>
    <button class="btn-start" id="btn-start">Begin</button>
    <p class="title-hint">Tap to explore &middot; Tap to survive</p>
  </div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div class="screen" id="screen-game">
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="hud">
    <span class="hud-chapter" id="hud-chapter"></span>
    <span class="hud-goal" id="hud-goal"></span>
  </div>
  <div class="story-area" id="story-area"></div>
</div>

<!-- ═══ END SCREEN ═══ -->
<div class="screen end-screen" id="screen-end">
  <div class="title-stars" id="end-stars"></div>
  <div class="end-hero">🐶</div>
  <div class="end-card">
    <div style="font-size:22px;letter-spacing:8px">💛 🏠 💛</div>
    <h2 class="end-h">Good boy, Hank.</h2>
    <p class="end-p">
      He never found his old family.<br><br>
      But somewhere between the barking and the digging and the long car ride —<br><br>
      <em>he found something better.</em>
    </p>
    <div class="title-paws" style="margin-top:0">🐾 🐾 🐾</div>
    <p class="end-label">— The End —</p>
    <button class="btn-restart" id="btn-restart">Play Again</button>
  </div>
</div>

<!-- ═══ CHAPTER INTRO OVERLAY ═══ -->
<div class="chapter-intro" id="chapter-intro">
  <div>
    <div class="ch-intro-num" id="ch-num"></div>
    <div class="ch-intro-name" id="ch-name"></div>
    <div class="ch-intro-sub" id="ch-sub"></div>
  </div>
</div>

</div>

<script>
// ═══════════════════════════════════════════
//  HANKY IS HOME — Text Adventure
// ═══════════════════════════════════════════

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let currentChapter = 0;
let visited = {};

// ═══════════════════════════════════════════
//  CHAPTER DATA
// ═══════════════════════════════════════════
const chapters = [
  // ── Chapter 1: Left Behind ──
  {
    num: 'Chapter One',
    name: 'Left Behind',
    sub: 'Hank sat tied to a post outside the shelter.\nHis family was gone.',
    goal: '🐾 Break free',
    progress: 0,
    intro: {
      emoji: '🌙',
      label: 'Night — Outside the shelter',
      text: 'The leash pulled tight against the old wooden post. Around Hank, the shelter was quiet except for the occasional whimper from inside.\n\nHis family\'s car had pulled away twenty minutes ago.\n\n<em>He was still waiting.</em>'
    },
    locations: [
      { id:'pull', emoji:'⛓️', name:'The leash', hint:'It\'s holding you back', minigame:'pull',
        text:'The leash dug into Hank\'s neck. He planted his paws and <em>pulled</em>.' },
      { id:'dog2', emoji:'🐩', name:'Another dog', hint:'Huddled in the corner', minigame:'whimper',
        text:'The poodle looked at you with sad eyes. A low whimper escaped her throat.\n\n<em>She knew.</em>' },
      { id:'post1', emoji:'🪵', name:'Fence post', hint:'Thick and sturdy', minigame:'chew',
        text:'Maybe if you chew through the rope...\n\nHank bit down <em>hard</em>.' },
      { id:'bowl', emoji:'🥣', name:'Water bowl', hint:'Sitting on the concrete',

// ═══════════════════════════════════════════
//  SCREEN MANAGEMENT
// ═══════════════════════════════════════════
function showScreen(id) {
  $$('.screen').forEach(s => s.classList.remove('active'));
  $(`#screen-${id}`).classList.add('active');
}

function makeStars(container) {
  container.innerHTML = '';
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() < .3 ? 3 : 2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*80}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*3).toFixed(1)}s;animation-duration:${(2+Math.random()*2).toFixed(1)}s`;
    container.appendChild(s);
  }
}

function showChapterIntro(ch) {
  const intro = $('#chapter-intro');
  $('#ch-num').textContent = ch.num;
  $('#ch-name').textContent = ch.name;
  $('#ch-sub').innerHTML = ch.sub.replace(/\n/g, '<br>');
  intro.classList.add('active');
  return new Promise(resolve => {
    setTimeout(() => {
      intro.classList.remove('active');
      setTimeout(resolve, 500);
    }, 2800);
  });
}


// ═══════════════════════════════════════════
//  RENDER CHAPTER
// ═══════════════════════════════════════════
function renderChapter(chIndex) {
  const ch = chapters[chIndex];
  const area = $('#story-area');
  area.innerHTML = '';
  area.scrollTop = 0;

  $('#hud-chapter').textContent = ch.num;
  $('#hud-goal').textContent = ch.goal;
  $('#progress').style.width = ch.progress + '%';

  // Intro scene
  const introBlock = document.createElement('div');
  introBlock.className = 'scene-block';
  introBlock.innerHTML = `
    <div class="scene-emoji">${ch.intro.emoji}</div>
    <div class="scene-label">${ch.intro.label}</div>
    <div class="scene-text">${ch.intro.text.replace(/\n/g, '<br>')}</div>
  `;
  area.appendChild(introBlock);

  // Separator
  const sep = document.createElement('div');
  sep.className = 'scene-block separator-block';
  sep.innerHTML = `<div style="text-align:center;font-size:12px;color:var(--text-dim);font-style:italic">· · · Look around. Tap to interact. · · ·</div>`;
  sep.style.animationDelay = '.15s';
  sep.style.padding = 'clamp(4px,1vh,12px) 18px';
  area.appendChild(sep);

  // Location list
  const locList = document.createElement('div');
  locList.className = 'location-list';
  locList.id = 'loc-list';

  const nonKeyLocs = ch.locations.filter(l => !l.key);
  const allNonKeyDone = nonKeyLocs.every(l => visited[`${chIndex}-${l.id}`]);

  ch.locations.forEach((loc, i) => {
    const item = document.createElement('div');
    item.className = 'location-item' + (loc.key ? ' key-item' : '');
    item.id = `loc-${loc.id}`;
    if (visited[`${chIndex}-${loc.id}`]) item.classList.add('visited');
    // Hide key items until all non-key items are done
    if (loc.key && !allNonKeyDone) item.classList.add('key-locked');
    if (loc.key && allNonKeyDone && !visited[`${chIndex}-${loc.id}`]) item.classList.add('key-revealed');
    item.style.animationDelay = (.2 + i * .08) + 's';
    item.innerHTML = `
      <span class="loc-emoji">${loc.emoji}</span>
      <div class="loc-info">
        <div class="loc-name">${loc.name}</div>
        <div class="loc-hint">${loc.hint}</div>
      </div>
      <span class="loc-badge">${loc.key ? '⚡ KEY' : 'SNIFF'}</span>
    `;
    if (!visited[`${chIndex}-${loc.id}`] && !(loc.key && !allNonKeyDone)) {
      item.addEventListener('click', () => interactWith(chIndex, loc, item));
    }
    locList.appendChild(item);
  });

  // Add nudge when key is revealed
  if (allNonKeyDone) {
    const keyLoc = ch.locations.find(l => l.key);
    if (keyLoc && !visited[`${chIndex}-${keyLoc.id}`]) {
      const nudge = document.createElement('div');
      nudge.className = 'scene-block separator-block';
      nudge.id = 'key-nudge';
      nudge.innerHTML = `<div style="text-align:center;font-size:clamp(12px,1.6vh,14px);color:var(--gold);font-style:italic">· · · Something new appeared · · ·</div>`;
      area.appendChild(nudge);
    }
  }

  area.appendChild(locList);
}


// ═══════════════════════════════════════════
//  INTERACTION
// ═══════════════════════════════════════════
function interactWith(chIndex, loc, itemEl) {
  const key = `${chIndex}-${loc.id}`;
  if (visited[key]) return;
  visited[key] = true;
  itemEl.classList.add('visited');

  const area = $('#story-area');
  const disc = document.createElement('div');
  disc.className = 'discovery-panel';
  disc.innerHTML = `
    <div class="disc-who">🐶 Hank discovers...</div>
    <div class="disc-text">${loc.text.replace(/\n/g, '<br>')}</div>
    <div class="action-row">
      <button class="btn-action" id="disc-continue">${loc.minigame ? 'Go →' : 'Got it →'}</button>
    </div>
  `;

  const locList = $('#loc-list');
  locList.parentNode.insertBefore(disc, locList.nextSibling);
  setTimeout(() => disc.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);

  disc.querySelector('#disc-continue').addEventListener('click', () => {
    disc.remove();
    if (loc.minigame) {
      launchMinigame(chIndex, loc.minigame, loc);
    } else {
      checkKeyReveal(chIndex);
      checkChapterComplete(chIndex);
    }
  });
}

function checkChapterComplete(chIndex) {
  const ch = chapters[chIndex];
  const allDone = ch.locations.every(loc => visited[`${chIndex}-${loc.id}`]);
  if (allDone && ch.beat) {
    setTimeout(() => showBeat(ch.beat, () => advanceChapter(chIndex)), 400);
  }
}

// Check if all non-key items are done and reveal the key item
function checkKeyReveal(chIndex) {
  const ch = chapters[chIndex];
  const nonKeyLocs = ch.locations.filter(l => !l.key);
  const keyLoc = ch.locations.find(l => l.key);
  if (!keyLoc) return;

  const allNonKeyDone = nonKeyLocs.every(l => visited[`${chIndex}-${l.id}`]);
  if (!allNonKeyDone) return;
  if (visited[`${chIndex}-${keyLoc.id}`]) return;

  const keyEl = $(`#loc-${keyLoc.id}`);
  if (!keyEl || !keyEl.classList.contains('key-locked')) return;

  // Insert a narrative nudge above the location list
  const locList = $('#loc-list');
  if (locList && !$('#key-nudge')) {
    const nudge = document.createElement('div');
    nudge.className = 'scene-block separator-block';
    nudge.id = 'key-nudge';
    nudge.innerHTML = `<div style="text-align:center;font-size:clamp(12px,1.6vh,14px);color:var(--gold);font-style:italic">· · · Something new appeared · · ·</div>`;
    locList.parentNode.insertBefore(nudge, locList);
  }

  // Reveal the key item
  keyEl.classList.remove('key-locked');
  keyEl.classList.add('key-revealed');
  keyEl.addEventListener('click', () => interactWith(chIndex, keyLoc, keyEl));

  // Scroll to it
  setTimeout(() => keyEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
}

function showBeat(beat, onContinue) {
  const area = $('#story-area');
  const panel = document.createElement('div');
  panel.className = 'beat-panel';
  panel.innerHTML = `
    <span class="beat-emoji">${beat.emoji}</span>
    <div class="beat-text">${beat.text.replace(/\n/g, '<br>')}</div>
    <button class="btn-action" id="beat-continue">Continue →</button>
  `;
  area.innerHTML = '';
  area.appendChild(panel);
  area.scrollTop = 0;
  panel.querySelector('#beat-continue').addEventListener('click', onContinue);
}

function advanceChapter(chIndex) {
  if (chIndex + 1 >= chapters.length) { doEnd(); return; }
  startChapter(chIndex + 1);
}

async function startChapter(chIndex) {
  currentChapter = chIndex;
  showScreen('game');
  await showChapterIntro(chapters[chIndex]);
  renderChapter(chIndex);
}


// ═══════════════════════════════════════════
//  MINIGAME LAUNCHER
// ═══════════════════════════════════════════
function launchMinigame(chIndex, type, loc) {
  const area = $('#story-area');
  area.innerHTML = '';
  area.scrollTop = 0;
  const panel = document.createElement('div');
  panel.className = 'minigame-panel';
  area.appendChild(panel);

  const mg = minigames[type];
  if (mg) mg(panel, chIndex, loc);
}

function returnToChapter(chIndex) {
  renderChapter(chIndex);
  checkKeyReveal(chIndex);
  checkChapterComplete(chIndex);
}


// ── Generic speed-tap builder ──
function buildSpeedTap(panel, opts) {
  panel.innerHTML = `
    <div class="mg-title">${opts.title}</div>
    <div class="mg-desc">${opts.desc}</div>
    <span class="mg-emoji" id="mg-em">${opts.emoji}</span>
    <div class="mg-track"><div class="mg-fill" id="mg-fill"></div></div>
    <div class="mg-counter" id="mg-count">0 / ${opts.total}</div>
    <button class="mg-tap-btn" id="mg-tap">${opts.btnText}</button>
    <p class="mg-note" id="mg-note"></p>
  `;
  let n = 0;
  $('#mg-tap').addEventListener('pointerdown', () => {
    if (n >= opts.total) return;
    n++;
    $('#mg-fill').style.width = (n / opts.total * 100) + '%';
    $('#mg-count').textContent = `${n} / ${opts.total}`;
    if (opts.onTick) opts.onTick(n, opts.total, $('#mg-em'), $('#mg-tap'));
    if (n >= opts.total) {
      $('#mg-tap').disabled = true;
      setTimeout(() => opts.onDone(panel), 600);
    }
  });
}

// ── Generic drain challenge (tap to fill while bar drains) ──
function buildDrainTap(panel, opts) {
  panel.innerHTML = `
    <div class="mg-title">${opts.title}</div>
    <div class="mg-desc">${opts.desc}</div>
    <span class="mg-emoji" id="mg-em">${opts.emoji}</span>
    <div class="mg-track"><div class="mg-fill" id="mg-fill" style="width:0%"></div></div>
    <div class="mg-counter" id="mg-count">${opts.hint || 'Keep tapping!'}</div>
    <button class="mg-tap-btn" id="mg-tap">${opts.btnText}</button>
    <p class="mg-note" id="mg-note"></p>
  `;
  let val = 0, done = false;
  const fill = $('#mg-fill'), btn = $('#mg-tap'), em = $('#mg-em');
  const interval = setInterval(() => {
    if (done) return;
    val = Math.max(0, val - (opts.drainRate || 2));
    fill.style.width = val + '%';
  }, 150);
  btn.addEventListener('pointerdown', () => {
    if (done) return;
    val = Math.min(100, val + (opts.tapGain || 8));
    fill.style.width = val + '%';
    if (opts.onTick) opts.onTick(val, em);
    if (val >= (opts.target || 100)) {
      done = true;
      clearInterval(interval);
      btn.disabled = true;
      setTimeout(() => opts.onDone(panel), 600);
    }
  });
}

// ── Generic hold challenge ──
function buildHoldChallenge(panel, opts) {
  panel.innerHTML = `
    <div class="mg-title">${opts.title}</div>
    <div class="mg-desc">${opts.desc}</div>
    <span class="mg-emoji" id="mg-em">${opts.emoji}</span>
    <div class="mg-track"><div class="mg-fill" id="mg-fill" style="width:0%"></div></div>
    <div class="mg-counter" id="mg-count">${opts.hint || 'Hold...'}</div>
    <button class="mg-tap-btn" id="mg-tap">${opts.btnText}</button>
    <p class="mg-note" id="mg-note"></p>
  `;
  let holding = false, val = 0, timer = null, done = false;
  const fill = $('#mg-fill'), btn = $('#mg-tap'), em = $('#mg-em'), note = $('#mg-note');

  function startHold() {
    if (done) return;
    holding = true;
    btn.textContent = opts.holdingText || 'HOLDING...';
    timer = setInterval(() => {
      if (!holding || done) return;
      val = Math.min(100, val + (opts.fillRate || 3));
      fill.style.width = val + '%';
      if (opts.onHoldTick) opts.onHoldTick(val, em, note);
      if (val >= 100) {
        done = true;
        clearInterval(timer);
        btn.disabled = true;
        if (opts.onDone) setTimeout(() => opts.onDone(panel), 600);
      }
    }, 100);
  }
  function stopHold() {
    if (done) return;
    holding = false;
    clearInterval(timer);
    btn.textContent = opts.btnText;
    if (val > 0 && val < 100) {
      val = Math.max(0, val - (opts.drainOnRelease || 12));
      fill.style.width = val + '%';
      if (opts.onRelease) opts.onRelease(note);
    }
  }
  btn.addEventListener('pointerdown', startHold);
  btn.addEventListener('pointerup', stopHold);
  btn.addEventListener('pointerleave', stopHold);
  btn.addEventListener('pointercancel', stopHold);
}

          <div class="mg-title" style="font-style:italic">Nothing.</div>
          <span class="mg-emoji">👃</span>
          <div class="mg-desc" style="color:var(--text-mid)">A hundred dogs. None of them family.<br><br><em>Keep searching.</em></div>
          <button class="btn-action" id="mg-back">Move on →</button>`;
        panel.querySelector('#mg-back').addEventListener('click', () => returnToChapter(chIndex));
      }
    });
  },

  // ── CH2: Beg at the bakery ──
  beg(panel, chIndex) {
    buildSpeedTap(panel, {
      title: 'BEG!', desc: 'Give her the saddest eyes you\'ve got!', emoji: '🥺', total: 10, btnText: 'PUPPY EYES!',
      onTick(n, total, em) {
        const faces = ['🥺','🐶','🥺','😢','🐶'];
        em.textContent = faces[n % faces.length];
        em.style.transform = `scale(${1 + n * .03})`;
        if (n === 6) $('#mg-note').textContent = '"She\'s looking..."';
        if (n >= total) { em.textContent = '🥐💛'; $('#mg-note').textContent = '"She tossed a warm croissant. Hank caught it mid-air."'; em.style.transform = ''; }
      },
      onDone() { setTimeout(() => returnToChapter(chIndex), 1400); }
    });
  },

  // ── CH2: Run through the park ──
  run(panel, chIndex) {
    buildDrainTap(panel, {
      title: 'RUN!', desc: 'Sprint through the park — nose down!', emoji: '🐶',
      target: 100, drainRate: 3, tapGain: 7, btnText: 'RUN!', hint: 'Faster!',
      onTick(val, em) {
        em.style.transform = `translateX(${(val / 100) * 30 - 15}px) scale(${val % 10 > 5 ? 1.05 : .95})`;
        if (val > 40 && val <= 70) $('#mg-note').textContent = '"Happy dogs everywhere. None of them care."';
        if (val > 70) $('#mg-note').textContent = '"You kept running."';
      },
      onDone(panel) {
        panel.innerHTML = `
          <div class="mg-title" style="font-style:italic">Exhausted.</div>
          <span class="mg-emoji">😮‍💨</span>
          <div class="mg-desc" style="color:var(--text-mid)">Hank collapsed on the grass, panting.<br>The park was full of families.<br><br><em>None of them his.</em></div>
          <button class="btn-action" id="mg-back">Keep going →</button>`;
        panel.querySelector('#mg-back').addEventListener('click', () => returnToChapter(chIndex));
      }
    });
  },

  // ── CH2: Howl at the old house (chapter ender) ──
  howl(panel, chIndex) {
    buildSpeedTap(panel, {
      title: 'HOWL!', desc: 'Call out to them. As loud as you can.', emoji: '🐶', total: 14, btnText: 'HOOOWL!',
      onTick(n, total, em) {
        em.style.transform = `scale(${1 + n * .04}) rotate(${n % 2 ? -5 : 5}deg)`;
        if (n === 4) $('#mg-note').textContent = '"The sound echoed off the empty house."';
        if (n === 8) $('#mg-note').textContent = '"No one came to the door."';
        if (n === 12) $('#mg-note').textContent = '"No one was coming."';
        if (n >= total) { em.textContent = '😔'; em.style.transform = ''; }
      },
      onDone() { showBeat(chapters[chIndex].beat, () => advanceChapter(chIndex)); }
    });
  },

  // ── CH3: Hide behind the tree (HOLD) ──
  hide(panel, chIndex) {
    buildHoldChallenge(panel, {
      title: 'HIDE!', desc: 'Hold to stay perfectly still...', emoji: '🌳',
      btnText: 'HOLD STILL', holdingText: 'HOLDING...', fillRate: 3, drainOnRelease: 15,
      hint: 'Don\'t let go...',
      onHoldTick(val, em, note) {
        em.style.transform = `scale(${1 - val / 400})`;
        if (val > 30) note.textContent = '"Don\'t move..."';
        if (val > 60) note.textContent = '"They\'re passing..."';
        if (val >= 100) { em.textContent = '🌿'; note.textContent = '"They walked right past."'; }
      },
      onRelease(note) { note.textContent = '"You flinched! Stay still!"'; },
      onDone() { setTimeout(() => returnToChapter(chIndex), 1000); }
    });
  },

  // ── CH3: Eat the sandwich ──
  eat(panel, chIndex) {
    buildSpeedTap(panel, {
      title: 'EAT!', desc: 'Before someone comes back for it!', emoji: '🥪', total: 10, btnText: 'CHOMP!',
      onTick(n, total, em) {
        const stages = ['🥪','🥪','🥪','🍞','🍞','🍞','🍞','😋','😋','😋','✨'];
        em.textContent = stages[Math.min(n, stages.length - 1)];
        em.style.transform = `scale(${1 + .06 * (n % 2)}) rotate(${n % 2 ? 8 : -8}deg)`;
        if (n >= total) { em.style.transform = ''; $('#mg-note').textContent = '"Your tail wagged — just once."'; }
      },
      onDone() { setTimeout(() => returnToChapter(chIndex), 1200); }
    });
  },

  // ── CH3: Bark at the strangers → Dig ──
  bark(panel, chIndex) {
    buildSpeedTap(panel, {
      title: 'BARK!', desc: 'Scare the giants away!', emoji: '🐶', total: 14, btnText: 'WOOF!',
      onTick(n, total, em) {
        em.style.transform = `scale(${1 + .08 * (n % 2)}) rotate(${n % 2 ? -8 : 8}deg)`;
        if (n >= total) { em.textContent = '😤'; em.style.transform = ''; }
      },
      onDone(panel) { mgDig(panel, chIndex); }
    });
  },

  // ── CH4: Watch out the window (drain) ──
  watch(panel, chIndex) {
    buildDrainTap(panel, {
      title: 'WATCH', desc: 'Press your nose to the glass. Track the world.', emoji: '🪟',
      target: 100, drainRate: 2, tapGain: 8, btnText: 'LOOK', hint: 'Keep watching...',
      onTick(val, em) {
        const scenes = ['🌳','🏠','🌾','🏙️','🌉','🌳'];
        em.textContent = scenes[Math.floor((val / 100) * (scenes.length - 1))];
      },
      onDone(panel) {
        panel.innerHTML = `
          <div class="mg-title" style="font-style:italic">Everything unfamiliar.</div>
          <span class="mg-emoji">🌌</span>
          <div class="mg-desc" style="color:var(--text-mid)">The world kept moving. Hank didn't recognise any of it.<br><br><em>Where are they taking me?</em></div>
          <button class="btn-action" id="mg-back">Accept it →</button>`;
        panel.querySelector('#mg-back').addEventListener('click', () => returnToChapter(chIndex));
      }
    });
  },

  // ── CH4: Scratch the door ──
  scratch(panel, chIndex) {
    buildSpeedTap(panel, {
      title: 'SCRATCH!', desc: 'Claw at the door handle!', emoji: '🚪', total: 16, btnText: 'SCRATCH!',
      onTick(n, total, em) {
        em.style.transform = `rotate(${n % 2 ? 6 : -6}deg)`;
        if (n === 6) $('#mg-note').textContent = '"The door rattled but held."';
        if (n === 12) $('#mg-note').textContent = '"A voice from the front: easy, buddy..."';
        if (n >= total) { em.textContent = '🔒'; em.style.transform = ''; $('#mg-note').textContent = '"Locked. No way out."'; }
      },
      onDone(panel) {
        panel.innerHTML = `
          <div class="mg-title" style="font-style:italic">No escape.</div>
          <span class="mg-emoji">🔒</span>
          <div class="mg-desc" style="color:var(--text-mid)">Hank slumped against the door.<br><br><em>Wherever this goes... it goes.</em></div>
          <button class="btn-action" id="mg-back">Give up →</button>`;
        panel.querySelector('#mg-back').addEventListener('click', () => returnToChapter(chIndex));
      }
    });
  },

  // ── CH4: Nestle into blanket (HOLD) ──
  nestle(panel, chIndex) {
    buildHoldChallenge(panel, {
      title: 'CURL UP', desc: 'Hold to nestle into the blanket...', emoji: '🧣',
      btnText: 'CURL UP', holdingText: 'HOLDING...', fillRate: 3, drainOnRelease: 10,
      hint: 'Hold to curl up...',
      onHoldTick(val, em, note) {
        em.style.transform = `scale(${1 - val / 300}) rotate(${val / 10}deg)`;
        if (val > 25) note.textContent = '"The blanket was warm."';
        if (val > 50) { note.textContent = '"Hank\'s eyes grew heavy."'; em.textContent = '😴'; }
        if (val > 75) note.textContent = '"Just... for a moment."';
        if (val >= 100) note.innerHTML = '<em>"Something almost like safe."</em>';
      },
      onRelease(note) { note.textContent = '"Not yet... hold on."'; },
      onDone() { setTimeout(() => returnToChapter(chIndex), 1000); }
    });
  },

  // ── CH4: The hand (choice) ──
  hand(panel, chIndex) {
    panel.innerHTML = `
      <div class="mg-title" style="font-style:italic">"A hand reached back..."</div>
      <div class="mg-desc">Slow. Patient. Waiting.</div>
      <span class="mg-emoji" id="mg-em" style="animation:float 2s ease-in-out infinite">🤚</span>
      <div class="choice-row">
        <button class="choice-btn yes" id="ch-yes">Accept 💛</button>
        <button class="choice-btn no" id="ch-no">Pull away 😤</button>
      </div>
      <p class="mg-note" id="mg-note"></p>`;
    function pick(yes) {
      $('#ch-yes').disabled = true;
      $('#ch-no').disabled = true;
      if (yes) { $('#mg-em').textContent = '🤚💛'; $('#mg-note').textContent = '"Your eyes closed. Just... for a moment."'; }
      else { $('#mg-em').textContent = '😤'; $('#mg-note').style.color = 'var(--text-dim)'; $('#mg-note').textContent = '"The hand retreated. No force. Somehow that made it worse."'; }
      setTimeout(() => {
        showBeat({ emoji: '🏡', text: 'The car slowed. Stopped.\n\nA door opened — cool air, fresh grass, something baking inside a house.\n\nHank was set down gently on the softest lawn he had ever felt.' }, () => advanceChapter(chIndex));
      }, 1800);
    }
    $('#ch-yes').addEventListener('pointerdown', () => pick(true));
    $('#ch-no').addEventListener('pointerdown', () => pick(false));
  },

  // ── CH5: Settle into bed (tap stages) ──
  settle(panel, chIndex) {
    const stages = [
      { emoji: '🔄', btn: 'CIRCLE...', note: '"Once around..."' },
      { emoji: '🔄', btn: 'AGAIN...', note: '"Twice around..."' },
      { emoji: '🐾', btn: 'PAW THE BED', note: '"Paw. Paw. Paw."' },
      { emoji: '🐾', btn: 'KEEP PAWING', note: '"Almost right..."' },
      { emoji: '🐶', btn: 'LIE DOWN', note: '"There."' },
      { emoji: '😌', btn: '', note: '' },
    ];
    const total = stages.length;
    panel.innerHTML = `
      <div class="mg-title">SETTLE IN</div>
      <div class="mg-desc">Circle... paw... lie down.</div>
      <span class="mg-emoji" id="mg-em">🛏️</span>
      <div class="mg-track"><div class="mg-fill" id="mg-fill" style="width:0%"></div></div>
      <button class="mg-tap-btn" id="mg-tap">CIRCLE</button>
      <p class="mg-note" id="mg-note"></p>`;
    let n = 0;
    $('#mg-tap').addEventListener('pointerdown', () => {
      if (n >= total) return;
      const s = stages[n];
      n++;
      $('#mg-fill').style.width = (n / total * 100) + '%';
      $('#mg-em').textContent = s.emoji;
      $('#mg-em').style.transform = `rotate(${n * 55}deg)`;
      if (s.note) $('#mg-note').textContent = s.note;
      if (n < total) $('#mg-tap').textContent = stages[n] ? stages[n].btn || 'DONE' : 'DONE';
      if (n >= total) {
        $('#mg-em').textContent = '😌';
        $('#mg-em').style.transform = '';
        $('#mg-tap').disabled = true;
        $('#mg-note').innerHTML = '<em>"It was exactly your size."</em>';
        setTimeout(() => returnToChapter(chIndex), 1200);
      }
    });
  },

  // ── CH5: Eat from the bowl ──
  feast(panel, chIndex) {
    buildSpeedTap(panel, {
      title: 'EAT!', desc: 'Real food. In a bowl with YOUR name on it.', emoji: '🍖', total: 12, btnText: 'NOM!',
      onTick(n, total, em) {
        em.style.transform = `scale(${1 + .05 * (n % 2)}) rotate(${n % 2 ? 6 : -6}deg)`;
        if (n === 3) $('#mg-note').textContent = '"Warm. Fresh. Real."';
        if (n === 7) $('#mg-note').textContent = '"Your tail was going so fast."';
        if (n >= total) { em.textContent = '✨'; em.style.transform = ''; $('#mg-note').innerHTML = '<em>"HANK. Your name. They knew it."</em>'; }
      },
      onDone() { setTimeout(() => returnToChapter(chIndex), 1400); }
    });
  },

  // ── CH5: Approach the humans (final) ──
  approach(panel, chIndex) {
    panel.innerHTML = `
      <div class="mg-title" style="font-style:italic">They're on the floor.</div>
      <div class="mg-desc">No hovering. No reaching.<br>Just waiting for you.</div>
      <div class="approach-scene">
        <div class="approach-humans" id="ap-humans">🧑 &nbsp;&nbsp;&nbsp; 🧑</div>
        <span class="approach-hank" id="ap-hank">🐶</span>
      </div>
      <button class="mg-tap-btn" id="mg-tap" style="margin-top:12px">Walk toward them →</button>
      <p class="mg-note" id="mg-note"></p>`;
    let steps = 0;
    $('#mg-tap').addEventListener('pointerdown', () => {
      steps++;
      if (steps === 1) {
        $('#ap-hank').style.transform = 'translateY(-8px) scale(1.05)';
        $('#mg-tap').textContent = 'Keep going...';
        $('#mg-note').textContent = '"One step. Then another."';
      } else if (steps === 2) {
        $('#ap-hank').style.transform = 'translateY(-16px) scale(1.1)';
        $('#mg-tap').textContent = 'Almost there...';
        $('#mg-note').textContent = '"Something settled. Something clicked."';
      } else {
        $('#ap-humans').innerHTML = '🧑🐶🧑';
        $('#ap-humans').style.fontSize = '52px';
        $('#ap-hank').style.opacity = '0';
        $('#ap-hank').style.transform = 'translateY(-24px) scale(0)';
        $('#mg-tap').disabled = true;
        $('#mg-note').innerHTML = '<em style="color:var(--gold);font-size:18px">Oh.</em>';
        setTimeout(() => doEnd(), 1800);
      }
    });
  }
};

// ── Dig (chained from bark) ──
function mgDig(panel, chIndex) {
  buildSpeedTap(panel, {
    title: 'DIG!', desc: 'Dig a hole to hide — fast!', emoji: '🐶', total: 16, btnText: 'DIG!',
    onTick(n, total, em) {
      em.textContent = ['🐶','🕳️','🐶','🕳️'][n % 4];
      em.style.transform = `scale(${1 - n / total * .2})`;
      if (n >= total) { em.style.transform = ''; $('#mg-count').textContent = 'Almost there...'; }
    },
    onDone(panel) {
      setTimeout(() => {
        panel.innerHTML = `
          <div class="mg-title" style="font-style:italic">Too late.</div>
          <span class="mg-emoji" style="animation:float 1.5s ease-in-out infinite">🙌</span>
          <div class="mg-desc" style="color:var(--text-mid);line-height:1.7">No matter how deep Hank dug —<br>the hands found him anyway.</div>`;
        setTimeout(() => {
          showBeat({
            emoji: '🙌',
            text: 'Hank barked his biggest bark. He dug and dug until the dirt flew.\n\nAnd then — two warm hands reached into the hole and lifted him gently into the sky.\n\n<em>The ground disappeared beneath his paws.</em>'
          }, () => advanceChapter(chIndex));
        }, 2000);
      }, 800);
    }
  });
}


// ═══════════════════════════════════════════
//  END
// ═══════════════════════════════════════════
function doEnd() {
  $('#progress').style.width = '100%';
  showScreen('end');
  makeStars($('#end-stars'));
}


// ═══════════════════════════════════════════
//  iOS ZOOM PREVENTION
// ═══════════════════════════════════════════
// Prevent double-tap zoom on iOS Safari
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
// Prevent pinch-to-zoom gesture
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });
// Prevent touch-based zoom on rapid taps
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });


// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════
makeStars($('#title-stars'));

$('#btn-start').addEventListener('click', () => {
  visited = {};
  startChapter(0);
});

$('#btn-restart').addEventListener('click', () => {
  visited = {};
  currentChapter = 0;
  showScreen('title');
});
</script>
</body>
</html>
