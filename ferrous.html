<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>ferrous · cloud LLM shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ferrous — a terminal-style LLM shell
     Cloud inference via Pollinations.ai — no key, no signup
     ============================================================ */
  :root {
    --bg:         #0a0a0c;
    --bg-soft:    #101013;
    --bg-elev:    #16161a;
    --line:       #1f1f25;
    --ink:        #d4d0c8;
    --ink-dim:    #8a8680;
    --ink-faint:  #4a4742;
    --green:      #7fb069;
    --amber:      #d9a441;
    --red:        #c75050;
    --blue:       #6ba3c4;
    --magenta:    #c489c4;
    --cursor:     #d4d0c8;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body {
    background:
      repeating-linear-gradient(180deg,
        rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
        transparent 1px, transparent 3px),
      radial-gradient(800px 500px at 50% -10%, rgba(127,176,105,0.04), transparent 60%),
      var(--bg);
  }
  button, input, textarea {
    font-family: inherit; font-size: inherit; color: inherit;
    background: none; border: none; outline: none; padding: 0;
  }
  .shell {
    height: 100vh;
    display: flex; flex-direction: column;
    max-width: 980px; margin: 0 auto; padding: 0 24px;
  }
  .titlebar {
    flex-shrink: 0; padding: 14px 0 10px;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .titlebar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .tb-prompt { color: var(--green); font-weight: 500; white-space: nowrap; }
  .tb-meta {
    color: var(--ink-faint); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tb-meta .sep { color: var(--ink-faint); margin: 0 8px; }
  .titlebar-right { display: flex; gap: 6px; flex-shrink: 0; }

  .tb-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--ink-dim);
    padding: 3px 8px; border: 1px solid var(--line);
    border-radius: 2px; background: var(--bg-soft);
  }
  .tb-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-faint); flex-shrink: 0;
  }
  .tb-status.ready .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .tb-status.busy  .dot { background: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
  .tb-status.err   .dot { background: var(--red); }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .term {
    flex: 1; overflow-y: auto; padding: 14px 0 4px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .term::-webkit-scrollbar { width: 8px; }
  .term::-webkit-scrollbar-track { background: transparent; }
  .term::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }

  .line {
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    padding: 1px 0;
  }
  .block { margin-bottom: 10px; animation: linein 180ms ease; }
  @keyframes linein {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: none; }
  }

  .role {
    display: inline-block; width: 9ch;
    color: var(--ink-faint); user-select: none;
  }
  .role.user      { color: var(--green); }
  .role.assistant { color: var(--magenta); }
  .role.system    { color: var(--amber); }
  .role.error     { color: var(--red); }
  .role.info      { color: var(--blue); }

  .content { color: var(--ink); }
  .content.dim     { color: var(--ink-dim); }
  .content.faint   { color: var(--ink-faint); }
  .content.amber   { color: var(--amber); }
  .content.red     { color: var(--red); }
  .content.green   { color: var(--green); }
  .content.blue    { color: var(--blue); }
  .content.magenta { color: var(--magenta); }

  .content code, .content pre {
    font-family: inherit;
    background: var(--bg-elev); border: 1px solid var(--line);
    padding: 1px 4px; border-radius: 2px;
  }
  .content pre {
    display: block; padding: 10px 12px; margin: 6px 0;
    overflow-x: auto; white-space: pre;
  }
  .content a { color: var(--blue); text-decoration: underline; }
  .content a:hover { color: var(--magenta); }

  .streaming-cursor {
    display: inline-block; width: 7px; height: 13px;
    background: var(--cursor); margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink 1s steps(2, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .banner {
    color: var(--green); white-space: pre;
    font-size: 11px; line-height: 1.2;
    margin: 4px 0 12px; opacity: 0.85;
  }
  .banner-sub {
    color: var(--ink-faint); font-size: 11.5px; margin: -8px 0 14px;
  }

  .prompt-row {
    flex-shrink: 0;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 0 16px;
    border-top: 1px solid var(--line);
  }
  .prompt-sigil {
    color: var(--green); flex-shrink: 0; padding-top: 1px;
    white-space: nowrap; user-select: none;
  }
  .prompt-input {
    flex: 1; background: none; border: none; color: var(--ink);
    font-family: inherit; font-size: inherit; line-height: 1.55;
    resize: none; padding: 0;
    min-height: 1.55em; max-height: 200px;
    caret-color: var(--green);
  }
  .prompt-input::placeholder { color: var(--ink-faint); }

  .help-table { border-collapse: collapse; margin: 4px 0; }
  .help-table td { padding: 1px 16px 1px 0; vertical-align: top; }
  .help-table .cmd  { color: var(--green); white-space: nowrap; }
  .help-table .desc { color: var(--ink-dim); }

  .hint {
    flex-shrink: 0;
    font-size: 10.5px; color: var(--ink-faint);
    padding: 0 0 8px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .hint kbd {
    font-family: inherit;
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 2px; padding: 0 4px;
    color: var(--ink-dim); font-size: 10px;
  }
  ::selection { background: rgba(127,176,105,0.25); color: var(--ink); }
  @media (max-width: 720px) {
    .shell { padding: 0 14px; }
    .tb-meta { display: none; }
    .role { width: 8ch; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="titlebar">
    <div class="titlebar-left">
      <span class="tb-prompt">~/ferrous</span>
      <span class="tb-meta" id="tbMeta">— model —</span>
    </div>
    <div class="titlebar-right">
      <span class="tb-status" id="tbStatus"><span class="dot"></span><span id="tbStatusText">starting</span></span>
    </div>
  </header>

  <div class="term" id="term" tabindex="0"></div>

  <div class="prompt-row">
    <span class="prompt-sigil" id="promptSigil">user&nbsp;&gt;</span>
    <textarea
      id="promptInput"
      class="prompt-input"
      rows="1"
      spellcheck="false"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      placeholder="type a message, or /help"
    ></textarea>
  </div>

  <div class="hint">
    <span>
      <kbd>Enter</kbd> send · <kbd>Shift+Enter</kbd> newline · <kbd>↑</kbd>/<kbd>↓</kbd> history · <kbd>Ctrl+C</kbd> stop · type <kbd>/help</kbd>
    </span>
    <span id="hintRight">cloud · anonymous · no key</span>
  </div>
</div>

<script type="module">
'use strict';

/* ================================================================
   1. Provider configuration
   ----------------------------------------------------------------
   Default: Pollinations.ai — anonymous, no key, no signup.
   Per their FAQ: "You can use our API with Anonymous access — no
   signup, account, or payment needed. You can call all free models,
   subject to standard rate limits."
   The endpoint is OpenAI-Chat-Completions compatible, so adding
   other providers later is a one-field change.
   ================================================================ */
const PROVIDERS = {
  pollinations: {
    label:       'Pollinations.ai (anonymous)',
    endpoint:    'https://text.pollinations.ai/openai',
    modelsUrl:   'https://text.pollinations.ai/models',
    needsKey:    false,
    defaultModel:'openai',
    // Pollinations uses string IDs like 'openai', 'mistral', 'deepseek',
    // 'qwen-coder', 'claude', 'gemini-fast' — see /models for the live list.
  },
};

/* ================================================================
   2. State & persistence
   ================================================================ */
const STORAGE_KEY  = 'ferrous.chat.v3';
const SETTINGS_KEY = 'ferrous.settings.v4';
const HISTORY_KEY  = 'ferrous.history.v1';

const defaultSettings = {
  provider:          'pollinations',
  model:             'openai',
  systemPrompt:
    'You are ferrous, a concise local-feeling AI assistant. ' +
    'Answer directly and accurately. Keep responses brief unless the user asks for depth. ' +
    'Use code blocks for code.',
  maxTokens:         1024,
  temperature:       0.7,
  topP:              0.9,
  contextLimit:      12000,
  seed:              null,    // null = random
};

const state = {
  messages:           [],
  settings:           { ...defaultSettings },
  status:             'idle',
  generating:         false,
  abortController:    null,
  currentAssistantId: null,
  currentAssistantNode: null,
  availableModels:    [],     // populated lazily on first /models call
  history:            [],
  historyIdx:         -1,
  draft:              '',
};

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) state.messages = p; }
  } catch (_) {}
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) state.settings = { ...defaultSettings, ...JSON.parse(raw) };
  } catch (_) {}
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) state.history = p.slice(-200); }
  } catch (_) {}
}
const persistMessages = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.messages)); } catch (_) {} };
const persistSettings = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); } catch (_) {} };
const persistHistory  = () => { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(-200))); } catch (_) {} };
const uid = () => 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);

/* ================================================================
   3. DOM
   ================================================================ */
const $ = (id) => document.getElementById(id);
const term         = $('term');
const promptInput  = $('promptInput');
const promptSigil  = $('promptSigil');
const tbStatus     = $('tbStatus');
const tbStatusText = $('tbStatusText');
const tbMeta       = $('tbMeta');
const hintRight    = $('hintRight');

/* ================================================================
   4. Terminal rendering
   ================================================================ */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderContent(text) {
  const parts = [];
  const fence = /```([a-zA-Z0-9_+\-]*)\n([\s\S]*?)```/g;
  let last = 0; let m;
  while ((m = fence.exec(text)) !== null) {
    if (m.index > last) parts.push({ kind: 'text', val: text.slice(last, m.index) });
    parts.push({ kind: 'code', val: m[2] });
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ kind: 'text', val: text.slice(last) });
  return parts.map(p => {
    if (p.kind === 'code') return '<pre>' + escapeHtml(p.val) + '</pre>';
    return escapeHtml(p.val).replace(/`([^`\n]+)`/g, '<code>$1</code>');
  }).join('');
}
function term_scroll() {
  const nearBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 80;
  if (nearBottom) term.scrollTop = term.scrollHeight;
}
function term_forceScroll() { term.scrollTop = term.scrollHeight; }

function term_writeBlock(roleLabel, roleClass, html, contentClass = '') {
  const block = document.createElement('div');
  block.className = 'block';
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML =
    '<span class="role ' + roleClass + '">' + escapeHtml(roleLabel) + '</span>' +
    '<span class="content ' + contentClass + '">' + html + '</span>';
  block.appendChild(line);
  term.appendChild(block);
  term_scroll();
  return block;
}
function term_writeStreaming(roleLabel, roleClass) {
  const block = document.createElement('div');
  block.className = 'block';
  const line = document.createElement('div');
  line.className = 'line';
  const content = document.createElement('span');
  content.className = 'content';
  content.innerHTML = '<span class="streaming-cursor"></span>';
  const roleSpan = document.createElement('span');
  roleSpan.className = 'role ' + roleClass;
  roleSpan.textContent = roleLabel;
  line.appendChild(roleSpan);
  line.appendChild(content);
  block.appendChild(line);
  term.appendChild(block);
  term_forceScroll();
  return { block, content };
}
const term_writeInfo  = (text, cls = 'dim') => term_writeBlock('info     ', 'info', escapeHtml(text), cls);
const term_writeError = (text) => term_writeBlock('error    ', 'error', escapeHtml(text), 'red');
function term_writeRaw(html, cls = '') {
  const block = document.createElement('div');
  block.className = 'block';
  const line = document.createElement('div');
  line.className = 'line ' + cls;
  line.innerHTML = html;
  block.appendChild(line);
  term.appendChild(block);
  term_scroll();
  return block;
}

/* ================================================================
   5. Banner + help
   ================================================================ */
function printBanner() {
  const banner =
    '   ___                                  \n' +
    '  / _/__ ___________  __ _____   ____   \n' +
    ' / _/ -_) __/ __/ _ \\/ // (_-<  /___/   \n' +
    '/_/ \\__/_/ /_/  \\___/\\_,_/___/         ';
  const sub = 'private · anonymous · cloud-backed · no key required';
  const block = document.createElement('div');
  block.className = 'block';
  const b = document.createElement('div'); b.className = 'banner'; b.textContent = banner;
  const s = document.createElement('div'); s.className = 'banner-sub'; s.textContent = sub;
  block.appendChild(b); block.appendChild(s);
  term.appendChild(block);
}
function printHelp() {
  const cmds = [
    ['/help',                    'show this help'],
    ['/model [name]',            'show or set the model (run /models for the list)'],
    ['/models',                  'list available models from the provider'],
    ['/system [text]',           'show or set the system prompt'],
    ['/set <key> <value>',       'set a generation param (temperature, maxTokens, topP, seed)'],
    ['/config',                  'show full current config'],
    ['/seed <n|random>',         'pin a seed for reproducible output (or "random")'],
    ['/clear',                   'clear conversation history'],
    ['/cls',                     'clear the screen (keeps history)'],
    ['/stop',                    'abort the current request (or Ctrl+C)'],
    ['/export',                  'download chat history as JSON'],
    ['/reset',                   'reset all settings to defaults'],
    ['/about',                   'where does inference happen?'],
  ];
  let html = '<table class="help-table">';
  for (const [c, d] of cmds) {
    html += '<tr><td class="cmd">' + escapeHtml(c) + '</td><td class="desc">' + escapeHtml(d) + '</td></tr>';
  }
  html += '</table>';
  term_writeRaw(html);
}

/* ================================================================
   6. Status / title bar
   ================================================================ */
function setStatus(stage, text) {
  state.status = stage;
  tbStatus.classList.remove('ready', 'busy', 'err');
  if (stage === 'ready' || stage === 'idle') tbStatus.classList.add('ready');
  else if (stage === 'error') tbStatus.classList.add('err');
  else tbStatus.classList.add('busy');
  tbStatusText.textContent = text;
  updatePromptUI();
}
function updateTbMeta() {
  const p = PROVIDERS[state.settings.provider];
  tbMeta.innerHTML =
    escapeHtml(state.settings.model) +
    '<span class="sep">·</span>' +
    escapeHtml(p ? p.label.split(' ')[0].toLowerCase() : state.settings.provider);
}
function updatePromptUI() {
  promptSigil.textContent = state.generating ? '… >' : 'user >';
  promptSigil.style.color =
    state.generating ? 'var(--amber)' :
    state.status === 'error' ? 'var(--red)' :
    'var(--green)';
}

/* ================================================================
   7. Context window manager
   ----------------------------------------------------------------
   Trims older turns until the prompt fits within `contextLimit`
   characters (rough proxy for tokens). System prompt is always
   preserved.
   ================================================================ */
function buildPromptMessages() {
  const sys = (state.settings.systemPrompt || '').trim();
  const result = [];
  if (sys) result.push({ role: 'system', content: sys });
  const budget = Math.max(500, parseInt(state.settings.contextLimit, 10) || 12000);
  const reversed = [];
  let used = sys.length;
  for (let i = state.messages.length - 1; i >= 0; i--) {
    const m = state.messages[i];
    const cost = (m.content || '').length + 16;
    if (used + cost > budget && reversed.length > 0) break;
    used += cost;
    reversed.push({ role: m.role, content: m.content });
  }
  reversed.reverse();
  return result.concat(reversed);
}

/* ================================================================
   8. Streaming chat completion
   ----------------------------------------------------------------
   Standard OpenAI-Chat-Completions over SSE. The wire format is:
     data: {"choices":[{"delta":{"content":"Hello"}, ...}]}
     data: {"choices":[{"delta":{"content":" world"}, ...}]}
     data: [DONE]
   We accumulate bytes from the ReadableStream, split on \n\n, and
   parse each "data: " payload as JSON. Empty deltas and the [DONE]
   sentinel are tolerated.
   ================================================================ */
async function streamChatCompletion({ provider, model, messages, params, onToken, signal }) {
  const cfg = PROVIDERS[provider];
  if (!cfg) throw new Error('unknown provider: ' + provider);

  const body = {
    model,
    messages,
    stream: true,
    temperature: Number(params.temperature),
    top_p: Number(params.topP),
    max_tokens: Math.max(16, Math.min(4096, parseInt(params.maxTokens, 10) || 1024)),
  };
  if (params.seed != null && !isNaN(params.seed)) body.seed = parseInt(params.seed, 10);

  const headers = { 'Content-Type': 'application/json' };
  if (cfg.needsKey && params.apiKey) headers['Authorization'] = 'Bearer ' + params.apiKey;

  const startTime = performance.now();
  const res = await fetch(cfg.endpoint, {
    method: 'POST',
    headers,
    body: JSON.stringify(body),
    signal,
  });

  if (!res.ok) {
    let detail = '';
    try { detail = await res.text(); } catch (_) {}
    throw new Error('HTTP ' + res.status + ' ' + res.statusText + (detail ? ' — ' + detail.slice(0, 280) : ''));
  }
  if (!res.body) throw new Error('no response body — server returned an empty stream.');

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let tokenCount = 0;
  let finishReason = null;

  // Parse SSE: events are separated by blank lines (\n\n).
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let nl;
    while ((nl = buffer.indexOf('\n\n')) !== -1) {
      const event = buffer.slice(0, nl);
      buffer = buffer.slice(nl + 2);
      if (!event.trim()) continue;

      // Each event may have multiple `data:` lines; OpenAI uses one.
      for (const rawLine of event.split('\n')) {
        const line = rawLine.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        if (payload === '[DONE]') { /* end-of-stream sentinel */ continue; }

        try {
          const obj = JSON.parse(payload);
          const choice = obj.choices && obj.choices[0];
          if (!choice) continue;
          const delta = choice.delta || choice.message || {};
          if (delta.content) {
            tokenCount++;
            onToken(delta.content);
          }
          if (choice.finish_reason) finishReason = choice.finish_reason;
        } catch (e) {
          // Some providers emit non-JSON keepalive lines; ignore.
        }
      }
    }
  }

  const elapsed = (performance.now() - startTime) / 1000;
  return {
    tokenCount,
    elapsedSec: elapsed.toFixed(2),
    tokensPerSec: tokenCount > 0 ? (tokenCount / elapsed).toFixed(1) : '0',
    finishReason,
  };
}

/* ================================================================
   9. Models endpoint
   ================================================================ */
async function fetchModels() {
  const cfg = PROVIDERS[state.settings.provider];
  if (!cfg.modelsUrl) return [];
  const res = await fetch(cfg.modelsUrl);
  if (!res.ok) throw new Error('models endpoint returned ' + res.status);
  const data = await res.json();
  // Pollinations returns an array of objects with { name, description, ... }
  // OpenAI-compatible providers return { data: [{ id, ... }] }.
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.data)) return data.data;
  return [];
}

/* ================================================================
   10. Sending a chat message
   ================================================================ */
async function sendChatMessage(text) {
  if (state.generating) {
    term_writeError('still generating — /stop first.');
    return;
  }

  const userMsg = { id: uid(), role: 'user', content: text, ts: Date.now() };
  state.messages.push(userMsg);
  persistMessages();
  term_writeBlock('user >   ', 'user', renderContent(text), 'green');

  const assistantMsg = { id: uid(), role: 'assistant', content: '', ts: Date.now() };
  state.messages.push(assistantMsg);
  state.currentAssistantId = assistantMsg.id;
  const stream = term_writeStreaming('ferrous >', 'assistant');
  state.currentAssistantNode = stream.content;

  state.generating = true;
  setStatus('generating', 'streaming…');
  updatePromptUI();

  state.abortController = new AbortController();
  let scrollScheduled = false;

  const onToken = (chunk) => {
    const msg = state.messages.find(m => m.id === state.currentAssistantId);
    if (!msg) return;
    msg.content += chunk;
    if (state.currentAssistantNode) {
      state.currentAssistantNode.innerHTML =
        renderContent(msg.content) + '<span class="streaming-cursor"></span>';
    }
    if (!scrollScheduled) {
      scrollScheduled = true;
      requestAnimationFrame(() => { scrollScheduled = false; term_scroll(); });
    }
  };

  try {
    const result = await streamChatCompletion({
      provider: state.settings.provider,
      model: state.settings.model,
      messages: buildPromptMessages(),
      params: {
        temperature: state.settings.temperature,
        topP: state.settings.topP,
        maxTokens: state.settings.maxTokens,
        seed: state.settings.seed,
      },
      onToken,
      signal: state.abortController.signal,
    });

    const msg = state.messages.find(m => m.id === state.currentAssistantId);
    if (msg) {
      msg.content = (msg.content || '').replace(/\s+$/, '');
      persistMessages();
      if (state.currentAssistantNode) {
        state.currentAssistantNode.innerHTML = renderContent(msg.content);
      }
    }
    setStatus('ready', result.tokensPerSec + ' tok/s');
    term_writeInfo(
      result.tokenCount + ' chunks · ' + result.elapsedSec + 's · ' + result.tokensPerSec + ' /s' +
      (result.finishReason ? ' · ' + result.finishReason : ''),
      'faint'
    );
  } catch (err) {
    if (err.name === 'AbortError') {
      term_writeInfo('aborted by user.', 'faint');
      setStatus('ready', 'aborted');
    } else {
      term_writeError(err.message || String(err));
      setStatus('error', 'error');
    }
    // Trim empty/incomplete assistant turn so it doesn't pollute history
    const msg = state.messages.find(m => m.id === state.currentAssistantId);
    if (msg) {
      if (!msg.content) {
        state.messages = state.messages.filter(x => x.id !== state.currentAssistantId);
      } else {
        // keep the partial reply but persist it
      }
      persistMessages();
      if (state.currentAssistantNode && msg.content) {
        state.currentAssistantNode.innerHTML = renderContent(msg.content);
      }
    }
  } finally {
    state.generating = false;
    state.abortController = null;
    state.currentAssistantId = null;
    state.currentAssistantNode = null;
    updatePromptUI();
  }
}

/* ================================================================
   11. Commands
   ================================================================ */
const commands = {
  help() { printHelp(); },

  about() {
    term_writeInfo('inference is handled by ' + (PROVIDERS[state.settings.provider]?.label || state.settings.provider) + '.');
    term_writeInfo('your prompts travel from your browser directly to the provider — no server in between.', 'faint');
    term_writeInfo('chat history and settings are stored only in this browser\'s localStorage.', 'faint');
    term_writeInfo('pollinations.ai docs: https://github.com/pollinations/pollinations', 'faint');
  },

  async models() {
    term_writeInfo('fetching available models…', 'faint');
    try {
      const list = await fetchModels();
      state.availableModels = list;
      if (!list.length) { term_writeInfo('no models returned.', 'faint'); return; }
      let html = '<table class="help-table">';
      for (const m of list) {
        const id   = m.name || m.id || m.model || String(m);
        const desc = m.description || m.type || m.alias || '';
        const cur  = id === state.settings.model ? ' <span class="content green">[current]</span>' : '';
        html += '<tr><td class="cmd">' + escapeHtml(id) + cur + '</td>' +
                '<td class="desc">' + escapeHtml(desc) + '</td></tr>';
      }
      html += '</table>';
      term_writeRaw(html);
      term_writeInfo('use /model <name> to switch.', 'faint');
    } catch (e) {
      term_writeError('failed to fetch models: ' + e.message);
    }
  },

  model(arg) {
    if (!arg) { term_writeInfo('current model: ' + state.settings.model); return; }
    state.settings.model = arg;
    persistSettings();
    updateTbMeta();
    term_writeInfo('model set to ' + arg);
  },

  system(arg) {
    if (!arg) {
      term_writeInfo('current system prompt:', 'faint');
      term_writeBlock('         ', 'info', escapeHtml(state.settings.systemPrompt), 'dim');
      return;
    }
    state.settings.systemPrompt = arg;
    persistSettings();
    term_writeInfo('system prompt updated.');
  },

  set(arg) {
    const parts = (arg || '').trim().split(/\s+/);
    const key = parts[0];
    const val = parts.slice(1).join(' ');
    if (!key || !val) { term_writeError('usage: /set <key> <value>'); return; }
    const numericKeys = ['maxTokens', 'temperature', 'topP', 'contextLimit'];
    if (numericKeys.includes(key)) {
      const n = parseFloat(val);
      if (isNaN(n)) { term_writeError('value must be numeric'); return; }
      state.settings[key] = n;
      persistSettings();
      term_writeInfo(key + ' = ' + n);
      return;
    }
    if (key === 'seed')   return commands.seed(val);
    if (key === 'model')  return commands.model(val);
    if (key === 'systemPrompt') return commands.system(val);
    term_writeError('unknown key: ' + key);
  },

  seed(arg) {
    if (!arg) {
      term_writeInfo('current seed: ' + (state.settings.seed == null ? 'random' : state.settings.seed));
      return;
    }
    if (arg === 'random' || arg === 'null' || arg === 'none') {
      state.settings.seed = null;
      persistSettings();
      term_writeInfo('seed cleared (random each call).');
      return;
    }
    const n = parseInt(arg, 10);
    if (isNaN(n)) { term_writeError('seed must be an integer or "random"'); return; }
    state.settings.seed = n;
    persistSettings();
    term_writeInfo('seed pinned to ' + n);
  },

  config() {
    const s = state.settings;
    const rows = [
      ['provider',      PROVIDERS[s.provider]?.label || s.provider],
      ['endpoint',      PROVIDERS[s.provider]?.endpoint || ''],
      ['model',         s.model],
      ['maxTokens',     String(s.maxTokens)],
      ['temperature',   String(s.temperature)],
      ['topP',          String(s.topP)],
      ['seed',          s.seed == null ? 'random' : String(s.seed)],
      ['contextLimit',  String(s.contextLimit) + ' chars'],
      ['messages',      String(state.messages.length)],
      ['status',        state.status],
    ];
    let html = '<table class="help-table">';
    for (const [k, v] of rows) {
      html += '<tr><td class="cmd">' + escapeHtml(k) + '</td><td class="desc">' + escapeHtml(v) + '</td></tr>';
    }
    html += '</table>';
    term_writeRaw(html);
  },

  clear() {
    if (state.generating) { term_writeError('busy — /stop first.'); return; }
    state.messages = [];
    persistMessages();
    term_writeInfo('conversation history cleared.');
  },

  cls() {
    term.innerHTML = '';
    printBanner();
    term_writeInfo('screen cleared. conversation history preserved.', 'faint');
  },

  stop() {
    if (!state.generating) { term_writeInfo('nothing to stop.', 'faint'); return; }
    if (state.abortController) state.abortController.abort();
  },

  export() {
    const blob = new Blob([JSON.stringify(state.messages, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ferrous-chat-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    term_writeInfo('exported ' + state.messages.length + ' messages.');
  },

  reset() {
    if (!confirm('Reset all settings to defaults? Conversation history will be preserved.')) return;
    state.settings = { ...defaultSettings };
    persistSettings();
    updateTbMeta();
    term_writeInfo('settings reset to defaults.');
  },
};

function dispatchCommand(line) {
  const trimmed = line.trim();
  if (!trimmed.startsWith('/')) return false;
  const space = trimmed.indexOf(' ');
  const name = (space === -1 ? trimmed.slice(1) : trimmed.slice(1, space)).toLowerCase();
  const arg  = space === -1 ? '' : trimmed.slice(space + 1).trim();
  term_writeBlock('user >   ', 'user', escapeHtml(trimmed), 'green');
  if (commands[name]) {
    Promise.resolve(commands[name](arg)).catch(e =>
      term_writeError('command failed: ' + (e.message || e))
    );
  } else {
    term_writeError('unknown command: /' + name + ' — try /help');
  }
  return true;
}

/* ================================================================
   12. Prompt input
   ================================================================ */
function autosizePrompt() {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(200, promptInput.scrollHeight) + 'px';
}
promptInput.addEventListener('input', () => {
  autosizePrompt();
  if (state.historyIdx !== -1) state.historyIdx = -1;
});
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'c' && (e.ctrlKey || e.metaKey) && state.generating) {
    e.preventDefault();
    commands.stop();
    return;
  }
  if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    commands.cls();
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submitPrompt();
    return;
  }
  if (e.key === 'ArrowUp' && !e.shiftKey) {
    if (state.history.length === 0) return;
    if (state.historyIdx === -1) {
      state.draft = promptInput.value;
      state.historyIdx = state.history.length - 1;
    } else if (state.historyIdx > 0) state.historyIdx--;
    promptInput.value = state.history[state.historyIdx];
    autosizePrompt();
    requestAnimationFrame(() => promptInput.setSelectionRange(promptInput.value.length, promptInput.value.length));
    e.preventDefault();
    return;
  }
  if (e.key === 'ArrowDown' && !e.shiftKey) {
    if (state.historyIdx === -1) return;
    if (state.historyIdx < state.history.length - 1) {
      state.historyIdx++;
      promptInput.value = state.history[state.historyIdx];
    } else {
      state.historyIdx = -1;
      promptInput.value = state.draft;
    }
    autosizePrompt();
    requestAnimationFrame(() => promptInput.setSelectionRange(promptInput.value.length, promptInput.value.length));
    e.preventDefault();
    return;
  }
});

function submitPrompt() {
  const text = promptInput.value;
  if (!text.trim()) return;
  if (state.history[state.history.length - 1] !== text) {
    state.history.push(text);
    if (state.history.length > 200) state.history.shift();
    persistHistory();
  }
  state.historyIdx = -1;
  state.draft = '';
  promptInput.value = '';
  autosizePrompt();

  if (dispatchCommand(text)) return;
  sendChatMessage(text);
}

term.addEventListener('click', () => {
  if (window.getSelection().toString()) return;
  promptInput.focus();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'c' && (e.ctrlKey || e.metaKey) && state.generating && document.activeElement !== promptInput) {
    e.preventDefault();
    commands.stop();
  }
});

/* ================================================================
   13. Replay
   ================================================================ */
function replayHistory() {
  if (state.messages.length === 0) return;
  term_writeInfo('— restored ' + state.messages.length + ' message(s) from previous session —', 'faint');
  for (const m of state.messages) {
    if (m.role === 'user') {
      term_writeBlock('user >   ', 'user', renderContent(m.content), 'green');
    } else {
      term_writeBlock('ferrous >', 'assistant', renderContent(m.content));
    }
  }
}

/* ================================================================
   14. Boot
   ================================================================ */
function init() {
  loadFromStorage();
  printBanner();
  printHelp();
  replayHistory();
  updateTbMeta();
  updatePromptUI();
  setStatus('ready', 'ready');
  hintRight.textContent = '☁ ' + (PROVIDERS[state.settings.provider]?.label || state.settings.provider);
  term_writeInfo(
    'ready. inference handled by ' + (PROVIDERS[state.settings.provider]?.label || state.settings.provider) +
    ' — no key needed. type /models to see what\'s available, or just start typing.',
    'faint'
  );
  promptInput.focus();
  autosizePrompt();
}

init();
</script>
