<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>ferrous · local LLM shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ferrous — a private, local-only LLM shell
     Terminal-style SPA · Transformers.js v3 · WebGPU/WASM
     ============================================================ */

  :root {
    --bg:         #0a0a0c;
    --bg-soft:    #101013;
    --bg-elev:    #16161a;
    --line:       #1f1f25;
    --ink:        #d4d0c8;
    --ink-dim:    #8a8680;
    --ink-faint:  #4a4742;
    --green:      #7fb069;
    --amber:      #d9a441;
    --red:        #c75050;
    --blue:       #6ba3c4;
    --magenta:    #c489c4;
    --cursor:     #d4d0c8;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    background:
      repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.012) 0px,
        rgba(255,255,255,0.012) 1px,
        transparent 1px,
        transparent 3px
      ),
      radial-gradient(800px 500px at 50% -10%, rgba(127,176,105,0.04), transparent 60%),
      var(--bg);
  }

  button, input, textarea {
    font-family: inherit; font-size: inherit; color: inherit;
    background: none; border: none; outline: none; padding: 0;
  }

  .shell {
    height: 100vh;
    display: flex; flex-direction: column;
    max-width: 980px; margin: 0 auto; padding: 0 24px;
  }

  .titlebar {
    flex-shrink: 0; padding: 14px 0 10px;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .titlebar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .tb-prompt { color: var(--green); font-weight: 500; white-space: nowrap; }
  .tb-title { color: var(--ink); font-weight: 500; }
  .tb-meta {
    color: var(--ink-faint); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tb-meta .sep { color: var(--ink-faint); margin: 0 8px; }
  .titlebar-right { display: flex; gap: 6px; flex-shrink: 0; }

  .tb-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--ink-dim);
    padding: 3px 8px; border: 1px solid var(--line);
    border-radius: 2px; background: var(--bg-soft);
  }
  .tb-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-faint); flex-shrink: 0;
  }
  .tb-status.ready .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .tb-status.busy  .dot { background: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
  .tb-status.err   .dot { background: var(--red); }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .term {
    flex: 1; overflow-y: auto; padding: 14px 0 4px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .term::-webkit-scrollbar { width: 8px; }
  .term::-webkit-scrollbar-track { background: transparent; }
  .term::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }

  .line {
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    padding: 1px 0;
  }
  .block { margin-bottom: 10px; animation: linein 180ms ease; }
  @keyframes linein {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: none; }
  }

  .role {
    display: inline-block; width: 9ch;
    color: var(--ink-faint); user-select: none;
  }
  .role.user      { color: var(--green); }
  .role.assistant { color: var(--magenta); }
  .role.system    { color: var(--amber); }
  .role.error     { color: var(--red); }
  .role.info      { color: var(--blue); }

  .content { color: var(--ink); }
  .content.dim     { color: var(--ink-dim); }
  .content.faint   { color: var(--ink-faint); }
  .content.amber   { color: var(--amber); }
  .content.red     { color: var(--red); }
  .content.green   { color: var(--green); }
  .content.blue    { color: var(--blue); }
  .content.magenta { color: var(--magenta); }

  .content code, .content pre {
    font-family: inherit;
    background: var(--bg-elev); border: 1px solid var(--line);
    padding: 1px 4px; border-radius: 2px;
  }
  .content pre {
    display: block; padding: 10px 12px; margin: 6px 0;
    overflow-x: auto; white-space: pre;
  }

  .streaming-cursor {
    display: inline-block; width: 7px; height: 13px;
    background: var(--cursor); margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink 1s steps(2, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .banner {
    color: var(--green); white-space: pre;
    font-size: 11px; line-height: 1.2;
    margin: 4px 0 12px; opacity: 0.85;
  }
  .banner-sub {
    color: var(--ink-faint); font-size: 11.5px; margin: -8px 0 14px;
  }

  .progress-bar { display: inline-block; color: var(--green); }

  .prompt-row {
    flex-shrink: 0;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 0 16px;
    border-top: 1px solid var(--line);
  }
  .prompt-sigil {
    color: var(--green); flex-shrink: 0; padding-top: 1px;
    white-space: nowrap; user-select: none;
  }
  .prompt-input {
    flex: 1; background: none; border: none; color: var(--ink);
    font-family: inherit; font-size: inherit; line-height: 1.55;
    resize: none; padding: 0;
    min-height: 1.55em; max-height: 200px;
    caret-color: var(--green);
  }
  .prompt-input::placeholder { color: var(--ink-faint); }

  .help-table { border-collapse: collapse; margin: 4px 0; }
  .help-table td { padding: 1px 16px 1px 0; vertical-align: top; }
  .help-table .cmd  { color: var(--green); white-space: nowrap; }
  .help-table .desc { color: var(--ink-dim); }

  .hint {
    flex-shrink: 0;
    font-size: 10.5px; color: var(--ink-faint);
    padding: 0 0 8px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .hint kbd {
    font-family: inherit;
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 2px; padding: 0 4px;
    color: var(--ink-dim); font-size: 10px;
  }

  ::selection { background: rgba(127,176,105,0.25); color: var(--ink); }

  @media (max-width: 720px) {
    .shell { padding: 0 14px; }
    .tb-meta { display: none; }
    .role { width: 8ch; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="titlebar">
    <div class="titlebar-left">
      <span class="tb-prompt">~/ferrous</span>
      <span class="tb-meta" id="tbMeta">no model loaded</span>
    </div>
    <div class="titlebar-right">
      <span class="tb-status" id="tbStatus"><span class="dot"></span><span id="tbStatusText">starting</span></span>
    </div>
  </header>

  <div class="term" id="term" tabindex="0"></div>

  <div class="prompt-row">
    <span class="prompt-sigil" id="promptSigil">user&nbsp;&gt;</span>
    <textarea
      id="promptInput"
      class="prompt-input"
      rows="1"
      spellcheck="false"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      placeholder="type a message, or /help"
    ></textarea>
  </div>

  <div class="hint">
    <span>
      <kbd>Enter</kbd> send · <kbd>Shift+Enter</kbd> newline · <kbd>↑</kbd>/<kbd>↓</kbd> history · <kbd>Ctrl+C</kbd> stop · type <kbd>/help</kbd>
    </span>
    <span id="hintRight">private · local · no network</span>
  </div>
</div>

<script type="module">
'use strict';

/* ================================================================
   1. Worker source (Blob URL, isolated thread)
   ================================================================ */
const workerSource = `
  let pipelinePromise = null;
  let currentModelKey = null;
  let stopRequested = false;
  let TF = null;

  async function ensureTransformers() {
    if (TF) return TF;
    TF = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2');
    if (TF.env) {
      TF.env.allowLocalModels = false;
      TF.env.allowRemoteModels = true;
      try {
        if (TF.env.backends && TF.env.backends.onnx && TF.env.backends.onnx.wasm) {
          TF.env.backends.onnx.wasm.numThreads = 1;
          TF.env.backends.onnx.wasm.proxy = false;
        }
      } catch (_) {}
    }
    return TF;
  }

  const postProgress = (payload) => self.postMessage({ type: 'PROGRESS', payload });
  const postStatus = (stage, detail, extra = {}) =>
    self.postMessage({ type: 'STATUS', payload: { stage, detail, ...extra } });
  const postLog = (level, text) =>
    self.postMessage({ type: 'LOG', payload: { level, text } });

  async function loadModel({ model, dtype, device }) {
    const key = model + '::' + dtype + '::' + device;
    if (key === currentModelKey && pipelinePromise) {
      const pipe = await pipelinePromise;
      postStatus('ready', 'cached', { model, dtype, device: pipe.__device });
      return pipe;
    }
    currentModelKey = key;

    pipelinePromise = (async () => {
      const { pipeline } = await ensureTransformers();

      let tryDevices = device === 'wasm' ? ['wasm'] : ['webgpu', 'wasm'];
      if (tryDevices[0] === 'webgpu') {
        let webgpuOK = false;
        try {
          if (typeof navigator !== 'undefined' && navigator.gpu && typeof navigator.gpu.requestAdapter === 'function') {
            const adapter = await navigator.gpu.requestAdapter();
            webgpuOK = !!adapter;
          }
        } catch (_) {}
        if (!webgpuOK) {
          postLog('warn', 'WebGPU adapter unavailable — using WASM backend.');
          tryDevices = ['wasm'];
        }
      }

      const requested = dtype || 'q8';
      const safeFallback = (dev) => {
        if (dev === 'webgpu') return requested === 'fp16' ? 'q4f16' : 'fp16';
        return requested === 'q8' ? 'q4' : 'q8';
      };
      const looksLikeOOM = (err) => {
        const m = ((err && err.message) || String(err) || '').toLowerCase();
        return m.includes('out of memory')
            || m.includes('aborted')
            || m.includes('allocation failed')
            || m.includes('rangeerror');
      };

      let lastErr = null;
      outer: for (const dev of tryDevices) {
        const dtypes = [requested];
        const fb = safeFallback(dev);
        if (fb !== requested) dtypes.push(fb);

        for (let i = 0; i < dtypes.length; i++) {
          const dt = dtypes[i];
          try {
            const note = i === 0
              ? (dev === 'webgpu' ? 'compiling webgpu shaders…' : 'initializing wasm runtime…')
              : 'retrying with dtype=' + dt + ' on ' + dev;
            postStatus(
              dev === 'webgpu' ? 'compiling' : 'fetching',
              note,
              { model, device: dev, dtype: dt }
            );
            const generator = await pipeline('text-generation', model, {
              device: dev,
              dtype: dt,
              progress_callback: postProgress,
            });
            generator.__device = dev;
            generator.__dtype = dt;
            postStatus('ready', 'model ready', { model, dtype: dt, device: dev });
            return generator;
          } catch (err) {
            lastErr = err;
            const msg = (err && err.message) ? err.message : String(err);
            postLog('warn', '[' + dev + '/' + dt + '] ' + msg.slice(0, 180));
            if (looksLikeOOM(err)) {
              postLog('warn', 'memory pressure on ' + dev + ' — aborting this backend.');
              await new Promise(r => setTimeout(r, 200));
              continue outer;
            }
          }
        }
      }
      throw lastErr || new Error('all device/dtype combinations failed.');
    })();

    try { return await pipelinePromise; }
    catch (err) {
      pipelinePromise = null;
      currentModelKey = null;
      throw err;
    }
  }

  async function runGeneration({ messages, maxTokens, temperature, topP, repetitionPenalty }) {
    stopRequested = false;
    if (!pipelinePromise) throw new Error('no model loaded.');
    const generator = await pipelinePromise;
    const tokenizer = generator.tokenizer;

    // Apply the model's own chat template so we emit the right special
    // tokens (<|im_start|>, <|im_end|>, etc). Without this, small instruct
    // models keep generating past their turn boundary and ramble.
    let promptInput;
    try {
      promptInput = tokenizer.apply_chat_template(messages, {
        tokenize: false,
        add_generation_prompt: true,
      });
    } catch (e) {
      // Fallback for models without a chat template.
      promptInput = messages.map(m => {
        if (m.role === 'system') return 'System: ' + m.content;
        if (m.role === 'user')   return 'User: ' + m.content;
        return 'Assistant: ' + m.content;
      }).join('\\n') + '\\nAssistant:';
    }

    // Build EOS token id set. Many chat templates use <|im_end|> as the
    // actual turn terminator, which is NOT the tokenizer's default eos_token.
    const eosSet = new Set();
    const addId = (id) => { if (typeof id === 'number' && id >= 0) eosSet.add(id); };
    if (tokenizer.eos_token_id != null) {
      if (Array.isArray(tokenizer.eos_token_id)) tokenizer.eos_token_id.forEach(addId);
      else addId(tokenizer.eos_token_id);
    }
    const extra = ['<|im_end|>', '<|end_of_text|>', '<|eot_id|>', '<|endoftext|>'];
    for (const tok of extra) {
      try {
        let id;
        if (tokenizer.added_tokens_encoder && tokenizer.added_tokens_encoder[tok] != null) {
          id = tokenizer.added_tokens_encoder[tok];
        } else if (tokenizer.model && tokenizer.model.tokens_to_ids && typeof tokenizer.model.tokens_to_ids.get === 'function') {
          id = tokenizer.model.tokens_to_ids.get(tok);
        }
        if (typeof id === 'number') addId(id);
      } catch (_) {}
    }
    const eosArr = Array.from(eosSet);

    const { TextStreamer } = TF;
    let tokenCount = 0;
    const startTime = performance.now();
    let stoppedEarly = false;

    const streamer = new TextStreamer(tokenizer, {
      skip_prompt: true,
      skip_special_tokens: true,
      callback_function: (text) => {
        if (stopRequested) { stoppedEarly = true; return; }
        if (!text) return;
        tokenCount += 1;
        self.postMessage({ type: 'STREAM_TOKEN', payload: { text } });
      },
    });

    try {
      await generator(promptInput, {
        max_new_tokens: Math.max(16, Math.min(2048, parseInt(maxTokens, 10) || 384)),
        do_sample: (parseFloat(temperature) || 0) > 0,
        temperature: parseFloat(temperature) || 0.7,
        top_p: parseFloat(topP) || 0.9,
        repetition_penalty: parseFloat(repetitionPenalty) || 1.15,
        return_full_text: false,
        eos_token_id: eosArr.length > 0 ? eosArr : undefined,
        streamer,
      });

      const elapsed = (performance.now() - startTime) / 1000;
      const tps = tokenCount > 0 ? (tokenCount / elapsed).toFixed(1) : '0';
      self.postMessage({
        type: 'STREAM_DONE',
        payload: {
          tokenCount,
          elapsedSec: elapsed.toFixed(2),
          tokensPerSec: tps,
          stopped: stoppedEarly,
        },
      });
    } catch (err) {
      self.postMessage({
        type: 'ERROR',
        payload: { where: 'GENERATE', message: err && err.message ? err.message : String(err) },
      });
    }
  }

  self.onmessage = async (e) => {
    const { type, payload } = e.data || {};
    try {
      if (type === 'LOAD_MODEL') await loadModel(payload);
      else if (type === 'GENERATE') await runGeneration(payload);
      else if (type === 'STOP') stopRequested = true;
      else if (type === 'PING') self.postMessage({ type: 'PONG' });
    } catch (err) {
      self.postMessage({
        type: 'ERROR',
        payload: { where: type, message: err && err.message ? err.message : String(err) },
      });
    }
  };

  self.postMessage({ type: 'WORKER_READY' });
`;

/* ================================================================
   2. State & persistence
   ================================================================ */
const STORAGE_KEY  = 'ferrous.chat.v2';
const SETTINGS_KEY = 'ferrous.settings.v3';
const HISTORY_KEY  = 'ferrous.history.v1';

const MODEL_PRESETS = [
  { id: 'HuggingFaceTB/SmolLM2-360M-Instruct',  label: 'SmolLM2 · 360M (fast, recommended)' },
  { id: 'HuggingFaceTB/SmolLM2-135M-Instruct',  label: 'SmolLM2 · 135M (tiny, very fast)' },
  { id: 'onnx-community/Qwen2.5-0.5B-Instruct', label: 'Qwen2.5 · 0.5B Instruct' },
  { id: 'HuggingFaceTB/SmolLM2-1.7B-Instruct',  label: 'SmolLM2 · 1.7B (slower, better)' },
];

const defaultSettings = {
  model: 'HuggingFaceTB/SmolLM2-360M-Instruct',
  dtype: 'q8',
  device: 'webgpu',
  systemPrompt:
    'You are ferrous, a concise local AI assistant running entirely in the user\'s browser. ' +
    'Answer directly and accurately. Keep responses brief unless the user asks for depth. ' +
    'Use code blocks for code. End your turn cleanly without rambling.',
  maxTokens: 384,
  temperature: 0.7,
  topP: 0.9,
  repetitionPenalty: 1.15,
  contextLimit: 6000,
};

const state = {
  messages: [],
  settings: { ...defaultSettings },
  status: 'idle',
  device: null,
  modelLoaded: null,
  generating: false,
  currentAssistantId: null,
  currentAssistantNode: null,
  history: [],
  historyIdx: -1,
  draft: '',
};

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) state.messages = parsed;
    }
  } catch (_) {}
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) state.settings = { ...defaultSettings, ...JSON.parse(raw) };
  } catch (_) {}
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) state.history = parsed.slice(-200);
    }
  } catch (_) {}
}
const persistMessages = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.messages)); } catch (_) {} };
const persistSettings = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); } catch (_) {} };
const persistHistory  = () => { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(-200))); } catch (_) {} };
const uid = () => 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);

/* ================================================================
   3. DOM references
   ================================================================ */
const $ = (id) => document.getElementById(id);
const term         = $('term');
const promptInput  = $('promptInput');
const promptSigil  = $('promptSigil');
const tbStatus     = $('tbStatus');
const tbStatusText = $('tbStatusText');
const tbMeta       = $('tbMeta');
const hintRight    = $('hintRight');

/* ================================================================
   4. Terminal rendering
   ================================================================ */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderContent(text) {
  const parts = [];
  const fence = /```([a-zA-Z0-9_+\-]*)\n([\s\S]*?)```/g;
  let last = 0; let m;
  while ((m = fence.exec(text)) !== null) {
    if (m.index > last) parts.push({ kind: 'text', val: text.slice(last, m.index) });
    parts.push({ kind: 'code', val: m[2] });
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ kind: 'text', val: text.slice(last) });
  return parts.map(p => {
    if (p.kind === 'code') return '<pre>' + escapeHtml(p.val) + '</pre>';
    return escapeHtml(p.val).replace(/`([^`\n]+)`/g, '<code>$1</code>');
  }).join('');
}
function term_scroll() {
  const nearBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 80;
  if (nearBottom) term.scrollTop = term.scrollHeight;
}
function term_forceScroll() { term.scrollTop = term.scrollHeight; }

function term_writeBlock(roleLabel, roleClass, html, contentClass = '') {
  const block = document.createElement('div');
  block.className = 'block';
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML =
    '<span class="role ' + roleClass + '">' + escapeHtml(roleLabel) + '</span>' +
    '<span class="content ' + contentClass + '">' + html + '</span>';
  block.appendChild(line);
  term.appendChild(block);
  term_scroll();
  return block;
}
function term_writeStreaming(roleLabel, roleClass) {
  const block = document.createElement('div');
  block.className = 'block';
  const line = document.createElement('div');
  line.className = 'line';
  const content = document.createElement('span');
  content.className = 'content';
  content.innerHTML = '<span class="streaming-cursor"></span>';
  const roleSpan = document.createElement('span');
  roleSpan.className = 'role ' + roleClass;
  roleSpan.textContent = roleLabel;
  line.appendChild(roleSpan);
  line.appendChild(content);
  block.appendChild(line);
  term.appendChild(block);
  term_forceScroll();
  return { block, content };
}
const term_writeSystem = (text, cls = '') => term_writeBlock('system   ', 'system', escapeHtml(text), cls);
const term_writeInfo   = (text, cls = 'dim') => term_writeBlock('info     ', 'info', escapeHtml(text), cls);
const term_writeError  = (text) => term_writeBlock('error    ', 'error', escapeHtml(text), 'red');
function term_writeRaw(html, cls = '') {
  const block = document.createElement('div');
  block.className = 'block';
  const line = document.createElement('div');
  line.className = 'line ' + cls;
  line.innerHTML = html;
  block.appendChild(line);
  term.appendChild(block);
  term_scroll();
  return block;
}

/* ================================================================
   5. Banner + help
   ================================================================ */
function printBanner() {
  const banner =
    '   ___                                  \n' +
    '  / _/__ ___________  __ _____   ____   \n' +
    ' / _/ -_) __/ __/ _ \\/ // (_-<  /___/   \n' +
    '/_/ \\__/_/ /_/  \\___/\\_,_/___/         ';
  const sub = 'private · local · transformers.js v3 · webgpu/wasm';
  const block = document.createElement('div');
  block.className = 'block';
  const b = document.createElement('div');
  b.className = 'banner';
  b.textContent = banner;
  const s = document.createElement('div');
  s.className = 'banner-sub';
  s.textContent = sub;
  block.appendChild(b);
  block.appendChild(s);
  term.appendChild(block);
}
function printHelp() {
  const cmds = [
    ['/help',                    'show this help'],
    ['/load [repo-id]',          'load a model (no arg = current selection)'],
    ['/model <preset|repo-id>',  'set the active model (does not load)'],
    ['/models',                  'list curated preset models'],
    ['/dtype <q8|q4|fp16|...>',  'set quantization dtype'],
    ['/device <webgpu|wasm>',    'set inference backend'],
    ['/system [text]',           'show or set the system prompt'],
    ['/set <key> <value>',       'set a generation param (temperature, maxTokens, ...)'],
    ['/config',                  'show full current config'],
    ['/clear',                   'clear the conversation history'],
    ['/cls',                     'clear the terminal screen (keeps history)'],
    ['/stop',                    'stop generation (or Ctrl+C)'],
    ['/export',                  'download chat history as JSON'],
    ['/reset',                   'reset all settings to defaults'],
  ];
  let html = '<table class="help-table">';
  for (const [c, d] of cmds) {
    html += '<tr><td class="cmd">' + escapeHtml(c) + '</td><td class="desc">' + escapeHtml(d) + '</td></tr>';
  }
  html += '</table>';
  term_writeRaw(html);
}

/* ================================================================
   6. Status / title bar
   ================================================================ */
function setStatus(stage, text) {
  state.status = stage;
  tbStatus.classList.remove('ready', 'busy', 'err');
  if (stage === 'ready' || stage === 'idle') tbStatus.classList.add('ready');
  else if (stage === 'error') tbStatus.classList.add('err');
  else tbStatus.classList.add('busy');
  tbStatusText.textContent = text;
  updatePromptUI();
}
function updateTbMeta() {
  if (state.modelLoaded) {
    const m = state.modelLoaded.split('/').pop();
    const dev = state.device || state.settings.device;
    tbMeta.innerHTML =
      escapeHtml(m) +
      '<span class="sep">·</span>' + escapeHtml(state.settings.dtype) +
      '<span class="sep">·</span>' + escapeHtml(dev || '');
  } else {
    tbMeta.textContent = 'no model loaded — type /load';
  }
}
function updatePromptUI() {
  promptSigil.textContent = state.generating ? '… >' : 'user >';
  promptSigil.style.color =
    state.generating ? 'var(--amber)' :
    state.status === 'error' ? 'var(--red)' :
    'var(--green)';
}

/* ================================================================
   7. Worker bootstrap
   ================================================================ */
const workerBlob = new Blob([workerSource], { type: 'application/javascript' });
const workerURL  = URL.createObjectURL(workerBlob);
const worker     = new Worker(workerURL, { type: 'module' });

worker.addEventListener('message', onWorkerMessage);
worker.addEventListener('error', (err) => {
  term_writeError('worker crashed: ' + (err.message || 'unknown'));
  setStatus('error', 'worker error');
});

let progressBlock = null;
function setProgress(pct, label) {
  if (!progressBlock) {
    progressBlock = document.createElement('div');
    progressBlock.className = 'block';
    term.appendChild(progressBlock);
  }
  const width = 28;
  let bar;
  if (pct == null) {
    bar = '[' + '·'.repeat(width) + ']';
  } else {
    const filled = Math.round((pct / 100) * width);
    bar = '[' + '█'.repeat(filled) + '·'.repeat(width - filled) + ']';
  }
  const pctStr = pct == null ? '  ?%' : (pct.toFixed(0).padStart(3, ' ') + '%');
  progressBlock.innerHTML =
    '<div class="line"><span class="role info">load     </span>' +
    '<span class="content"><span class="progress-bar">' + bar + '</span> ' + pctStr +
    '  <span class="content faint">' + escapeHtml(label || '') + '</span></span></div>';
  term_scroll();
}
function clearProgress() {
  if (progressBlock) { progressBlock.remove(); progressBlock = null; }
}

/* ================================================================
   8. Worker message handler
   ================================================================ */
function onWorkerMessage(e) {
  const { type, payload } = e.data || {};

  if (type === 'WORKER_READY') {
    setStatus('idle', 'idle');
    bootGreeting();
    return;
  }

  if (type === 'LOG') {
    const cls = payload.level === 'warn' ? 'amber' : payload.level === 'error' ? 'red' : 'dim';
    const role = payload.level === 'warn' ? 'system' : 'info';
    term_writeBlock(payload.level.padEnd(9, ' '), role, escapeHtml(payload.text), cls);
    return;
  }

  if (type === 'PROGRESS') {
    if (payload && payload.status === 'progress') {
      const hasTotal = typeof payload.total === 'number' && payload.total > 0;
      const hasPct = typeof payload.progress === 'number' && !isNaN(payload.progress);
      const file = payload.file ? payload.file.split('/').pop() : 'file';
      const mb = payload.loaded ? (payload.loaded / (1024 * 1024)).toFixed(1) : '?';
      if (hasTotal && hasPct) {
        const total = (payload.total / (1024 * 1024)).toFixed(1);
        setProgress(payload.progress, file + ' · ' + mb + ' / ' + total + ' MB');
      } else {
        setProgress(null, file + ' · ' + mb + ' MB');
      }
    } else if (payload && payload.status === 'ready') {
      clearProgress();
    }
    return;
  }

  if (type === 'STATUS') {
    const { stage, detail, model, device, dtype } = payload;
    if (device) {
      state.device = device;
      hintRight.textContent = device === 'webgpu' ? '⚡ webgpu' : '⚙ wasm cpu';
    }
    if (stage === 'fetching')       setStatus('loading', 'fetching');
    else if (stage === 'compiling') setStatus('loading', 'compiling');
    else if (stage === 'ready') {
      state.modelLoaded = model || state.settings.model;
      if (dtype) state.settings.dtype = dtype;
      state.settings.lastLoaded = state.modelLoaded;
      persistSettings();
      clearProgress();
      updateTbMeta();
      setStatus('ready', 'ready');
      term_writeInfo('loaded ' + state.modelLoaded + ' (' + (dtype || state.settings.dtype) + ', ' + (device || state.device) + ')');
    }
    return;
  }

  if (type === 'STREAM_TOKEN') {
    const text = payload.text || '';
    if (!state.currentAssistantId) return;
    const msg = state.messages.find(m => m.id === state.currentAssistantId);
    if (!msg) return;
    msg.content += text;
    if (state.currentAssistantNode) {
      state.currentAssistantNode.innerHTML =
        renderContent(msg.content) + '<span class="streaming-cursor"></span>';
    }
    if (!onWorkerMessage._scroll) {
      onWorkerMessage._scroll = true;
      requestAnimationFrame(() => {
        onWorkerMessage._scroll = false;
        term_scroll();
      });
    }
    return;
  }

  if (type === 'STREAM_DONE') {
    state.generating = false;
    const msg = state.messages.find(m => m.id === state.currentAssistantId);
    if (msg) {
      msg.content = (msg.content || '').replace(/\s+$/, '');
      persistMessages();
      if (state.currentAssistantNode) {
        state.currentAssistantNode.innerHTML = renderContent(msg.content);
      }
    }
    state.currentAssistantId = null;
    state.currentAssistantNode = null;
    const stoppedNote = payload.stopped ? ' (stopped)' : '';
    setStatus('ready', payload.tokensPerSec + ' tok/s');
    term_writeInfo(payload.tokenCount + ' tokens in ' + payload.elapsedSec + 's · ' + payload.tokensPerSec + ' tok/s' + stoppedNote, 'faint');
    updatePromptUI();
    return;
  }

  if (type === 'ERROR') {
    state.generating = false;
    const msg = (payload && payload.message) || 'unknown error';
    if (payload && payload.where === 'LOAD_MODEL') {
      state.settings.lastLoaded = null;
      persistSettings();
      clearProgress();
    }
    term_writeError(msg);
    setStatus('error', 'error');
    if (state.currentAssistantId) {
      const m = state.messages.find(x => x.id === state.currentAssistantId);
      if (m && !m.content) {
        state.messages = state.messages.filter(x => x.id !== state.currentAssistantId);
        persistMessages();
      }
      state.currentAssistantId = null;
      state.currentAssistantNode = null;
    }
    updatePromptUI();
    return;
  }
}

/* ================================================================
   9. Context window manager
   ================================================================ */
function buildPromptMessages() {
  const sys = (state.settings.systemPrompt || '').trim();
  const result = [];
  if (sys) result.push({ role: 'system', content: sys });
  const budget = Math.max(500, parseInt(state.settings.contextLimit, 10) || 6000);
  const reversed = [];
  let used = sys.length;
  for (let i = state.messages.length - 1; i >= 0; i--) {
    const m = state.messages[i];
    const cost = (m.content || '').length + 16;
    if (used + cost > budget && reversed.length > 0) break;
    used += cost;
    reversed.push({ role: m.role, content: m.content });
  }
  reversed.reverse();
  return result.concat(reversed);
}

/* ================================================================
   10. Commands
   ================================================================ */
function resolveModelArg(arg) {
  if (!arg) return null;
  const lc = arg.toLowerCase();
  for (const p of MODEL_PRESETS) {
    if (p.id.toLowerCase() === lc) return p.id;
    if (p.id.toLowerCase().includes(lc)) return p.id;
    if (p.label.toLowerCase().includes(lc)) return p.id;
  }
  if (/^[\w.\-]+\/[\w.\-]+$/.test(arg)) return arg;
  return null;
}

const commands = {
  help() { printHelp(); },

  models() {
    let html = '<table class="help-table">';
    for (const p of MODEL_PRESETS) {
      const cur = p.id === state.settings.model
        ? ' <span class="content green">[current]</span>' : '';
      html += '<tr><td class="cmd">' + escapeHtml(p.id) + cur +
              '</td><td class="desc">' + escapeHtml(p.label) + '</td></tr>';
    }
    html += '</table>';
    term_writeRaw(html);
    term_writeInfo('use /model <preset|repo-id> to switch, then /load to load.', 'faint');
  },

  model(arg) {
    if (!arg) { term_writeInfo('current model: ' + state.settings.model); return; }
    const resolved = resolveModelArg(arg);
    if (!resolved) {
      term_writeError('not a known preset or valid repo-id: ' + arg);
      term_writeInfo('expected format: org/model-name, or a preset substring. try /models', 'faint');
      return;
    }
    state.settings.model = resolved;
    persistSettings();
    term_writeInfo('model set to ' + resolved + ' — run /load to load it.');
  },

  load(arg) {
    if (arg) {
      const r = resolveModelArg(arg);
      if (!r) { term_writeError('invalid model: ' + arg); return; }
      state.settings.model = r;
      persistSettings();
    }
    if (state.generating) { term_writeError('busy generating — /stop first.'); return; }
    setStatus('loading', 'loading…');
    term_writeInfo('loading ' + state.settings.model + ' (' + state.settings.dtype + ', ' + state.settings.device + ')');
    worker.postMessage({
      type: 'LOAD_MODEL',
      payload: {
        model: state.settings.model,
        dtype: state.settings.dtype,
        device: state.settings.device,
      },
    });
  },

  dtype(arg) {
    if (!arg) { term_writeInfo('current dtype: ' + state.settings.dtype); return; }
    const valid = ['q4', 'q4f16', 'q8', 'int8', 'fp16', 'fp32'];
    if (!valid.includes(arg)) {
      term_writeError('invalid dtype. choose: ' + valid.join(', '));
      return;
    }
    state.settings.dtype = arg;
    persistSettings();
    updateTbMeta();
    term_writeInfo('dtype set to ' + arg + ' — /load to apply.');
  },

  device(arg) {
    if (!arg) { term_writeInfo('current device: ' + state.settings.device); return; }
    if (arg !== 'webgpu' && arg !== 'wasm') {
      term_writeError('invalid device. choose: webgpu, wasm');
      return;
    }
    state.settings.device = arg;
    persistSettings();
    updateTbMeta();
    term_writeInfo('device set to ' + arg + ' — /load to apply.');
  },

  system(arg) {
    if (!arg) {
      term_writeInfo('current system prompt:', 'faint');
      term_writeBlock('         ', 'info', escapeHtml(state.settings.systemPrompt), 'dim');
      return;
    }
    state.settings.systemPrompt = arg;
    persistSettings();
    term_writeInfo('system prompt updated.');
  },

  set(arg) {
    const parts = (arg || '').trim().split(/\s+/);
    const key = parts[0];
    const val = parts.slice(1).join(' ');
    if (!key || !val) { term_writeError('usage: /set <key> <value>'); return; }
    const numericKeys = ['maxTokens', 'temperature', 'topP', 'repetitionPenalty', 'contextLimit'];
    if (numericKeys.includes(key)) {
      const n = parseFloat(val);
      if (isNaN(n)) { term_writeError('value must be numeric'); return; }
      state.settings[key] = n;
      persistSettings();
      term_writeInfo(key + ' = ' + n);
      return;
    }
    if (key === 'systemPrompt') return commands.system(val);
    if (key === 'model')        return commands.model(val);
    if (key === 'dtype')        return commands.dtype(val);
    if (key === 'device')       return commands.device(val);
    term_writeError('unknown key: ' + key);
  },

  config() {
    const s = state.settings;
    const rows = [
      ['model',             s.model],
      ['dtype',             s.dtype],
      ['device',            s.device + (state.device ? ' (actual: ' + state.device + ')' : '')],
      ['maxTokens',         String(s.maxTokens)],
      ['temperature',       String(s.temperature)],
      ['topP',              String(s.topP)],
      ['repetitionPenalty', String(s.repetitionPenalty)],
      ['contextLimit',      String(s.contextLimit) + ' chars'],
      ['messages stored',   String(state.messages.length)],
      ['status',            state.status],
    ];
    let html = '<table class="help-table">';
    for (const [k, v] of rows) {
      html += '<tr><td class="cmd">' + escapeHtml(k) + '</td><td class="desc">' + escapeHtml(v) + '</td></tr>';
    }
    html += '</table>';
    term_writeRaw(html);
  },

  clear() {
    if (state.generating) { term_writeError('busy generating — /stop first.'); return; }
    state.messages = [];
    persistMessages();
    term_writeInfo('conversation history cleared.');
  },

  cls() {
    term.innerHTML = '';
    printBanner();
    term_writeInfo('screen cleared. conversation history preserved.', 'faint');
  },

  stop() {
    if (!state.generating) { term_writeInfo('nothing to stop.', 'faint'); return; }
    worker.postMessage({ type: 'STOP' });
    term_writeInfo('stop requested…', 'faint');
  },

  export() {
    const blob = new Blob([JSON.stringify(state.messages, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ferrous-chat-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    term_writeInfo('exported ' + state.messages.length + ' messages.');
  },

  reset() {
    if (!confirm('Reset all settings to defaults? Conversation history will be preserved.')) return;
    state.settings = { ...defaultSettings };
    persistSettings();
    updateTbMeta();
    term_writeInfo('settings reset to defaults.');
  },
};

function dispatchCommand(line) {
  const trimmed = line.trim();
  if (!trimmed.startsWith('/')) return false;
  const space = trimmed.indexOf(' ');
  const name = (space === -1 ? trimmed.slice(1) : trimmed.slice(1, space)).toLowerCase();
  const arg  = space === -1 ? '' : trimmed.slice(space + 1).trim();
  term_writeBlock('user >   ', 'user', escapeHtml(trimmed), 'green');
  if (commands[name]) {
    try { commands[name](arg); }
    catch (e) { term_writeError('command failed: ' + (e.message || e)); }
  } else {
    term_writeError('unknown command: /' + name + ' — try /help');
  }
  return true;
}

/* ================================================================
   11. Sending a chat message
   ================================================================ */
function sendChatMessage(text) {
  if (state.status !== 'ready') {
    term_writeBlock('user >   ', 'user', renderContent(text), 'green');
    term_writeError('no model loaded. run /load (or /models to choose one).');
    return;
  }
  if (state.generating) {
    term_writeError('still generating — /stop first.');
    return;
  }

  const userMsg = { id: uid(), role: 'user', content: text, ts: Date.now() };
  state.messages.push(userMsg);
  persistMessages();
  term_writeBlock('user >   ', 'user', renderContent(text), 'green');

  const assistantMsg = { id: uid(), role: 'assistant', content: '', ts: Date.now() };
  state.messages.push(assistantMsg);
  state.currentAssistantId = assistantMsg.id;
  const stream = term_writeStreaming('ferrous >', 'assistant');
  state.currentAssistantNode = stream.content;

  state.generating = true;
  setStatus('generating', 'thinking…');
  updatePromptUI();

  worker.postMessage({
    type: 'GENERATE',
    payload: {
      messages: buildPromptMessages(),
      maxTokens: state.settings.maxTokens,
      temperature: state.settings.temperature,
      topP: state.settings.topP,
      repetitionPenalty: state.settings.repetitionPenalty,
    },
  });
}

/* ================================================================
   12. Prompt input
   ================================================================ */
function autosizePrompt() {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(200, promptInput.scrollHeight) + 'px';
}
promptInput.addEventListener('input', () => {
  autosizePrompt();
  if (state.historyIdx !== -1) state.historyIdx = -1;
});
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'c' && (e.ctrlKey || e.metaKey) && state.generating) {
    e.preventDefault();
    commands.stop();
    return;
  }
  if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    commands.cls();
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submitPrompt();
    return;
  }
  if (e.key === 'ArrowUp' && !e.shiftKey) {
    if (state.history.length === 0) return;
    if (state.historyIdx === -1) {
      state.draft = promptInput.value;
      state.historyIdx = state.history.length - 1;
    } else if (state.historyIdx > 0) {
      state.historyIdx--;
    }
    promptInput.value = state.history[state.historyIdx];
    autosizePrompt();
    requestAnimationFrame(() => promptInput.setSelectionRange(promptInput.value.length, promptInput.value.length));
    e.preventDefault();
    return;
  }
  if (e.key === 'ArrowDown' && !e.shiftKey) {
    if (state.historyIdx === -1) return;
    if (state.historyIdx < state.history.length - 1) {
      state.historyIdx++;
      promptInput.value = state.history[state.historyIdx];
    } else {
      state.historyIdx = -1;
      promptInput.value = state.draft;
    }
    autosizePrompt();
    requestAnimationFrame(() => promptInput.setSelectionRange(promptInput.value.length, promptInput.value.length));
    e.preventDefault();
    return;
  }
});

function submitPrompt() {
  const text = promptInput.value;
  if (!text.trim()) return;
  if (state.history[state.history.length - 1] !== text) {
    state.history.push(text);
    if (state.history.length > 200) state.history.shift();
    persistHistory();
  }
  state.historyIdx = -1;
  state.draft = '';
  promptInput.value = '';
  autosizePrompt();

  if (dispatchCommand(text)) return;
  sendChatMessage(text);
}

term.addEventListener('click', () => {
  if (window.getSelection().toString()) return;
  promptInput.focus();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'c' && (e.ctrlKey || e.metaKey) && state.generating && document.activeElement !== promptInput) {
    e.preventDefault();
    commands.stop();
  }
});

/* ================================================================
   13. Replay stored history
   ================================================================ */
function replayHistory() {
  if (state.messages.length === 0) return;
  term_writeInfo('— restored ' + state.messages.length + ' message(s) from previous session —', 'faint');
  for (const m of state.messages) {
    if (m.role === 'user') {
      term_writeBlock('user >   ', 'user', renderContent(m.content), 'green');
    } else {
      term_writeBlock('ferrous >', 'assistant', renderContent(m.content));
    }
  }
}

/* ================================================================
   14. Boot
   ================================================================ */
function bootGreeting() {
  const m = state.settings.lastLoaded;
  if (m) {
    term_writeInfo('restoring previous model: ' + m + ' (' + state.settings.dtype + ')');
    setStatus('loading', 'restoring…');
    worker.postMessage({
      type: 'LOAD_MODEL',
      payload: { model: m, dtype: state.settings.dtype, device: state.settings.device },
    });
  } else {
    term_writeInfo('no model loaded yet. type /load to load ' + state.settings.model + ', or /models to choose.', 'amber');
  }
}

function init() {
  loadFromStorage();
  printBanner();
  printHelp();
  replayHistory();
  updateTbMeta();
  updatePromptUI();

  if (typeof navigator !== 'undefined' && !('gpu' in navigator)) {
    term_writeInfo('this browser has no WebGPU — falling back to WASM (slower but works everywhere).', 'amber');
  }

  promptInput.focus();
  autosizePrompt();
}

init();
setTimeout(() => { try { URL.revokeObjectURL(workerURL); } catch (_) {} }, 5000);
</script>
</body>
</html>
